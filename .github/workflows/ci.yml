# OMNIA — GitHub Actions CI (essenziale)
# Suite billing/B04 offline-safe + Master residual R-02:
# H1/H2, B04-I/II, Slice1, MC-045 H3, MC-042 v2/deroga/wallet, R-01 refresh/cease.
# I test che richiedono secret/Mongo live restano fuori da questo job.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-billing-unit:
    name: Backend billing / B04 unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run B04 + Master residual (H3 / MC-042 / R-01) unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --tb=short \
            tests/test_b04_h1_h2_wallet_authz.py \
            tests/test_b04ii_wallet_ledger.py \
            tests/test_b04i_foundations.py \
            tests/test_slice1_b01_b03.py \
            tests/test_mc045_h3_allocate_link.py \
            tests/test_mc042_v2_suspend_deroga.py \
            tests/test_mc042_cc_non_operable_wallet.py \
            tests/test_mc042_r01_refresh_cease.py \
            tests/test_r03_allocate_concurrency.py

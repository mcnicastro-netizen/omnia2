# OMNIA — GitHub Actions CI (essenziale)
# Job iniziale: suite billing/B04 offline-safe (H1/H2, B04-I, B04-II, Slice1).
# I test che richiedono secret/Mongo live restano fuori da questo job.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-billing-unit:
    name: Backend billing / B04 unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run B04 / H1-H2 / Slice1 unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --tb=short \
            tests/test_b04_h1_h2_wallet_authz.py \
            tests/test_b04ii_wallet_ledger.py \
            tests/test_b04i_foundations.py \
            tests/test_slice1_b01_b03.py

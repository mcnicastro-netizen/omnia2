# HAL — Voci esportate per RAG
# Capitolo 20 · API Keys e integrazioni (Track B / API Gateway)
# D-051: doppia economia crediti (Track A €0,05 vs Track B €0,03), pricing separato,
# top-up manuale, plaintext show-once, hash SHA-256, allowed_origins CORS widget.

voci:

  - id: api-keys.cos-e
    titolo: Cos'è API Keys / Track B / API Gateway
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [api-keys, track-b, api-gateway, partner, integrazione, d-041, d-046]
    correlati: [api-keys.dove-trovarlo, api-keys.api-v1-endpoints, api-keys.pricing-track-b]
    domanda_naturale: "Cos'è Track B / API Gateway di OMNIA? A cosa servono le chiavi API?"
    contenuto:
      a_cosa_serve: >
        Pilastro Track B (D-041/D-046) per partner esterni (web agency,
        portali, gestionali) che integrano feature OMNIA (Valutatore
        UNI 10750, Comparatore Mutui, HAL Legal, Feed immobili) nei
        loro widget/CRM tramite chiavi API `omk_live_...` + Bearer auth.
      quando_si_usa: >
        Quando vuoi esporre feature OMNIA a un widget di terza parte
        o un gestionale esterno.
      passi:
        - "Emetti chiave da /app/api-keys (ApiKeysPage)."
        - "Assegna crediti iniziali (top-up successivi consentiti)."
        - "Copia plaintext SHOW-ONCE (poi hash SHA-256 in DB)."
        - "Partner usa `Authorization: Bearer omk_live_...` su /api/v1/*."
      errori_comuni:
        - problema: "Chiedo la mia API key vecchia per rileggerla"
          soluzione: >
            Non recuperabile. Solo plaintext show-once. Emetti nuova
            chiave + trasferisci crediti + revoca vecchia.
      permessi:
        - "Emissione/gestione: agency_admin owner, super_admin, group_admin"
    screenshot: []

  - id: api-keys.dove-trovarlo
    titolo: Dove trovo ApiKeysPage (/app/api-keys)
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: base

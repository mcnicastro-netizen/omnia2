    correlati: [api-keys.cos-e, api-keys.emissione-show-once]
    domanda_naturale: "Dove trovo la pagina per gestire le API Keys?"
    contenuto:
      a_cosa_serve: >
        Localizzare la ApiKeysPage nel menu laterale ImmoWeb.
      quando_si_usa: >
        Quando vuoi emettere/gestire chiavi Track B.
      passi:
        - "Sidebar: voce Chiavi API (current='api-keys')."
        - "Route frontend: /app/api-keys."
        - "Permessi: agency_admin, super_admin, group_admin. Il
          group_admin con group_id popolato vede TUTTE le chiavi
          delle branch del gruppo."
      errori_comuni: []
      permessi:
        - "agency_admin, super_admin, group_admin"
    screenshot: []

  - id: api-keys.emissione-show-once
    titolo: Emissione chiave · formato omk_live_ + plaintext show-once + hash SHA-256
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: avanzato
    tags: [api-keys, emissione, plaintext, show-once, hash, sha-256, prefix, formato, omk-live]
    correlati: [api-keys.cos-e, api-keys.revoca-key, api-keys.credit-wallet]
    domanda_naturale: "Come emetto una nuova API key? La chiave si può recuperare dopo?"
    contenuto:
      a_cosa_serve: >
        Emettere una API key con formato omk_live_<28chars>, mostrando
        il plaintext UNA sola volta (poi solo hash SHA-256 in DB).
      quando_si_usa: >
        Prima integrazione di un partner tech.
      passi:
        - "Endpoint: POST /api/app/api-keys."
        - "Body: {name (obbligatorio 1-120), initial_credits (0-1M),
          partner_id (opz 60ch), allowed_origins (opz list)}."
        - "Formato plaintext: omk_live_<28 base32 chars>
          (api_key.py:22)."
        - "Hash storato: SHA-256 hex digest (nessun plaintext
          persistito)."
        - "Prefix visibile: primi 12 char per search/UI (key_prefix)."
        - "UI box show-once: banner emerald con font monospace +
          bottone Copia (navigator.clipboard.writeText) + × chiudi."
        - "Onestà: se perdi il plaintext senza copiarlo, devi emettere
          nuova chiave (nessun recovery)."
      errori_comuni:
        - problema: "Ho chiuso il box senza copiare la chiave"
          soluzione: >
            Plaintext perso definitivamente. Emetti nuova chiave con
            POST /api-keys, trasferisci crediti con /credits, revoca
            la vecchia con /revoke.
      permessi:
        - "agency_admin, super_admin"
    screenshot:
      - "[SCREEN: cap20-apikeys-issued-box]"

  - id: api-keys.credit-wallet
    titolo: Credit wallet Track B · top-up manuale + api_credit_ledger
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: avanzato
    tags: [api-keys, crediti, wallet, top-up, ledger, api-credit-ledger, manuale, stripe-no]
    correlati: [api-keys.pricing-track-b, api-keys.usage-log]
    domanda_naturale: "Come carico crediti su una chiave API? Posso fare auto-ricarica Stripe?"
    contenuto:
      a_cosa_serve: >
        Aggiungere/scalare crediti manualmente sulla chiave API +
        audit trail append-only in api_credit_ledger.
      quando_si_usa: >
        Ricarica ordinaria o correzione saldo.
      passi:
        - "Endpoint: POST /api/app/api-keys/{id}/credits."
        - "Body: {delta (int -1M/+1M), reason (obbligatorio 1-200)}."
        - "delta > 0 → top-up. delta < 0 → deduct (rimborsi/correzioni)."
        - "Guard new_balance < 0 → HTTP 400 balance_would_go_negative."
        - "Ogni movimento in api_credit_ledger: {api_key_id,
          agency_id, delta, new_balance, reason, actor_user_id,
          created_at}."
        - "⚠️ Manuale v1: no auto-ricarica Stripe. Documentato
          in api_keys.py:154 'Manual until M4/Stripe'."
        - "UI top-up: prompt() browser nativo (NO modale custom v1)."
      errori_comuni:
        - problema: "HTTP 400 balance_would_go_negative"
          soluzione: >
            delta negativo maggiore del saldo attuale. Riduci delta.
      permessi:
        - "agency_admin owner della chiave"
    screenshot: []

  - id: api-keys.allowed-origins
    titolo: Allowed origins · CORS whitelist widget (M2.5.3)
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: avanzato
    tags: [api-keys, allowed-origins, cors, widget-security, origin, referer, wildcard, m2-5-3]
    correlati: [api-keys.widget-embed-loader, api-keys.errori-comuni]
    domanda_naturale: "Come limito una API key ai widget su un dominio specifico?"
    contenuto:
      a_cosa_serve: >
        Restringere una chiave API a un elenco di origini web (per
        widget embed sicuro).
      quando_si_usa: >
        Quando emetti una chiave per un widget su un dominio partner.
      passi:
        - "Endpoint: PATCH /api/app/api-keys/{id}/origins."
        - "Body: {allowed_origins: List[str]}."
        - "Lista vuota → nessuna restrizione (uso server-side)."
        - "Lista popolata → solo widget su quei domini possono
          usare la chiave (check Origin/Referer)."
        - "Wildcard supportato: https://*.agenziarossi.it matcha
          subdomain."
        - "Pulizia input: str(o).strip().rstrip('/') per ogni entry."
      errori_comuni:
        - problema: "HTTP 403 origin_not_allowed dal widget"
          soluzione: >
            Il dominio caller non è nella whitelist. Aggiorna origins
            via PATCH o svuota la lista per uso server-side.
      permessi:
        - "agency_admin owner della chiave"
    screenshot: []

  - id: api-keys.revoca-key
    titolo: Revoca chiave · no undo · emetti nuova invece
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [api-keys, revoca, is-active, revoked-at, no-undo, security]
    correlati: [api-keys.emissione-show-once]
    domanda_naturale: "Come revoco una API key compromessa? Posso riattivarla?"
    contenuto:
      a_cosa_serve: >
        Deattivare immediatamente una chiave API (non reversibile).
      quando_si_usa: >
        Chiave compromessa/perdita partner/fine progetto.
      passi:
        - "Endpoint: POST /api/app/api-keys/{id}/revoke."
        - "Effetto: is_active=false, revoked_at=now."
        - "NON reversibile. Per 'riattivare' → emetti nuova chiave
          + trasferisci crediti + revoca la vecchia."
        - "UI: bottone rosso 'revoca' + confirm() browser (NO modale
          custom)."
      errori_comuni:
        - problema: "Ho revocato per errore"
          soluzione: >
            Non recuperabile. Emetti nuova chiave con POST /api-keys +
            top-up crediti + comunica nuova chiave al partner.
      permessi:
        - "agency_admin owner della chiave"
    screenshot: []

  - id: api-keys.usage-log
    titolo: Usage log audit · endpoint /usage · NO UI detail v1
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [api-keys, usage-log, audit, api-usage-log, billing, credits-spent, no-ui]
    correlati: [api-keys.credit-wallet, api-keys.limitazioni-v1]
    domanda_naturale: "Come vedo l'utilizzo dettagliato di una API key? Storico endpoint chiamati?"
    contenuto:
      a_cosa_serve: >
        Consultare storico chiamate per una chiave (billing audit) via
        endpoint dedicato — NO UI dettaglio v1.
      quando_si_usa: >
        Debug consumo crediti anomalo o audit periodico.
      passi:
        - "Endpoint: GET /api/app/api-keys/{id}/usage?limit=50
          (max 500)."
        - "Collezione: api_usage_log {api_key_id, endpoint,
          credits_charged, status_code, error_code, created_at}."
        - "⚠️ NO UI dettaglio v1: la ApiKeysPage tabella mostra solo
          credits_balance + credits_spent cumulativi. Nessun pulsante
          'Vedi utilizzi'."
        - "Backlog A-026 (UI usage detail per chiave)."
      errori_comuni:
        - problema: "Voglio vedere quali endpoint hanno consumato crediti"
          soluzione: >
            v1 solo tramite curl GET /usage o query Mongo diretta.
            Nessun drilldown UI.
      permessi:
        - "agency_admin owner della chiave"
    screenshot: []

  - id: api-keys.api-v1-endpoints
    titolo: API Gateway /api/v1/* · 6 endpoint consumer Bearer
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin, partner]
    livello: avanzato
    tags: [api-keys, api-v1, gateway, endpoints, valuator, mortgages, legal, feed, health, me, widgets-lead, staging, bearer]
    correlati: [api-keys.pricing-track-b, api-keys.widget-embed-loader]
    domanda_naturale: "Quali endpoint /api/v1 esistono? Quanto costa ogni chiamata? Come autentico?"
    contenuto:
      a_cosa_serve: >
        Documentare i 6+ endpoint consumer del Gateway `/api/v1/*`
        con relativo costo in crediti Track B.
      quando_si_usa: >
        Documentazione integrazione partner.
      passi:
        - "Auth: Authorization: Bearer omk_live_... (header
          obbligatorio, no cookie)."
        - "Router: apps/v1/gateway.py prefix /v1."
        - "GET /api/v1/health → 0 crediti (no auth) · ping."
        - "GET /api/v1/me → 0 · ispezione chiave + saldo."
        - "POST /api/v1/valuator → 5 crediti · Valutazione UNI 10750."
        - "POST /api/v1/mortgages/compare → 1 credito · Comparatore
          mutui."
        - "POST /api/v1/legal/ask → 3 crediti · HAL Legal one-shot Q&A."
        - "GET /api/v1/feed/properties → 0 · export inventory agency."
        - "POST /api/v1/widgets/lead → 0 · cattura lead da widget."
        - "POST /api/v1/staging/* → ~15 crediti (async pipeline)."
        - "Charge/log: dopo ogni request charge_and_log() scala
          crediti, aggiorna credits_spent, scrive api_usage_log."
      errori_comuni:
        - problema: "401 unauthorized su /api/v1"
          soluzione: >
            Header Authorization mancante o formato errato. Verifica
            prefix omk_live_.
        - problema: "402 insufficient_credits"
          soluzione: >
            Saldo chiave < costo endpoint. Top-up via POST /credits.
      permessi:
        - "Solo caller con Bearer omk_live_ valido + saldo sufficiente"
    screenshot: []

  - id: api-keys.pricing-track-b
    titolo: Pricing Track B · 1 credito = €0,03 (vs Track A €0,05 · wallet separati)
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [api-keys, pricing, crediti, "0-03-euro", track-a, track-b, wallet-separati, differenza, cap19-billing]
    correlati: [api-keys.credit-wallet, api-keys.api-v1-endpoints]
    domanda_naturale: "Quanto costa un credito Track B? È diverso da quello dei piani B2B?"
    contenuto:
      a_cosa_serve: >
        Chiarire la doppia economia crediti OMNIA: Track A (piani B2B
        + credit packages BillingPage) a €0,05/cred vs Track B
        (API Gateway ApiKeysPage) a €0,03/cred.
      quando_si_usa: >
        Prima di preventivare i costi di integrazione partner.
      passi:
        - "Track A (Cap. 19 §19.10 BillingPage): 1 credito = €0,05
          (ratio 20 cred/€, no volume discount)."
        - "Track B (ApiKeysPage subtitle): 1 credito = €0,03."
        - "Onestà D-051: le due economie sono CONTABILMENTE SEPARATE
          v1. La chiave API ha il proprio credits_balance
          indipendente dal wallet della subscription B2B
          (sub.wallet.balance)."
        - "Un titolare Pro con 1200 cr/mese NON vede quei crediti
          sulla chiave API: deve fare POST /credits top-up separato."
        - "Costi tipici Track B: valuator 5cr=€0,15, mortgages 1cr=
          €0,03, legal 3cr=€0,09, feed+lead 0cr (freebie)."
        - "⚠️ Pricing Track B (€0,03) NON esposto in BillingPage
          (solo menzionato subtitle ApiKeysPage e test_credentials.md)."
      errori_comuni:
        - problema: "Ho un piano Pro ma la chiave API dice saldo 0"
          soluzione: >
            Wallet Track A e Track B sono separati. Fai top-up sulla
            chiave con POST /api-keys/{id}/credits.
      permessi:
        - "Documentazione informativa"
    screenshot: []

  - id: api-keys.widget-embed-loader
    titolo: Widget embed · loader script /api/widgets/v1/loader.js
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin, partner]

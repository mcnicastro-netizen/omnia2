  - id: api-keys.errori-comuni
    titolo: Errori comuni API Keys (401/402/403/404 + plaintext perso)
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin, partner]
    livello: intermedio
    tags: [api-keys, errori, "401", "402", "403", "404", troubleshooting, plaintext-perso, insufficient-credits, origin-not-allowed]
    correlati: [api-keys.emissione-show-once, api-keys.allowed-origins, api-keys.credit-wallet]
    domanda_naturale: "Perché la mia chiave API non funziona? Errori comuni?"
    contenuto:
      a_cosa_serve: >
        Checklist troubleshooting per errori comuni sulle chiavi API.
      quando_si_usa: >
        Debug integrazione partner.
      passi:
        - "E1 · 401 unauthorized: header Authorization: Bearer
          omk_live_... mancante o formato errato. Fix: verifica
          prefix omk_live_."
        - "E2 · 402 insufficient_credits: saldo chiave < costo
          endpoint (5cr valuator, 3cr legal, 1cr mortgages). Fix:
          POST /credits con delta positivo."
        - "E3 · 403 origin_not_allowed: chiave con allowed_origins
          popolato + widget in dominio non whitelisted. Fix: PATCH
          /origins o svuota lista."
        - "E4 · 404 api_key_not_found: chiave non appartiene alla
          tua agency. Fix: verifica ownership."
        - "E5 · Persa la plaintext dopo emissione: nessun recovery.
          Emetti nuova chiave + POST /credits con delta = saldo
          vecchia + revoca vecchia con POST /revoke."
      errori_comuni: []
      permessi:
        - "Troubleshooting"
    screenshot: []

  - id: api-keys.limitazioni-v1
    titolo: Limiti v1 API Keys / Track B (D-051 · elenco esaustivo)
    modulo: API Keys
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [api-keys, limiti, cosa-non-fa, auto-ricarica-no, usage-ui-no, rate-limit-no, scoping-no, ip-whitelist-no, webhook-no, rotazione-no, d-051]
    correlati: [api-keys.cos-e, api-keys.pricing-track-b]
    domanda_naturale: "Cosa NON fa API Keys v1? Ha auto-ricarica, rate limit, scoping endpoint, IP whitelist, webhook, rotazione automatica?"
    contenuto:
      a_cosa_serve: >
        Elenco esaustivo di cosa Track B v1 NON fa (D-051).
      quando_si_usa: >
        Prima di aspettarti auto-ricarica Stripe o rate limit.
      passi:
        - "NO auto-ricarica Stripe (top-up manuale via POST /credits)."
        - "NO UI usage detail per chiave (endpoint /usage esiste,
          no button v1). Backlog A-026."
        - "NO reportistica per-partner (partner_id tracciato ma
          nessun rollup UI). Backlog A-027."
        - "NO rotazione automatica chiavi (nessun cron scadenza)."
        - "NO scoping per endpoint (chiave con crediti puo' chiamare
          TUTTI gli endpoint /api/v1/*, no restrizione feature)."
        - "NO rate limit per-chiave (solo controllo saldo)."
        - "NO IP whitelist (solo Origin/Referer per widget)."
        - "NO webhook eventi (issued/revoked/depleted)."
        - "NO modale custom top-up/revoca (usa prompt()/confirm()
          browser nativi)."
        - "Pricing Track B (€0,03) NON esposto in BillingPage
          (solo subtitle ApiKeysPage)."
        - "Wallet Track B contabilmente separato dal wallet piani
          B2B (Cap. 19 §19.10)."
        - "Widget disponibili v1: solo valuator/mortgages/lead-
          capture. Altri TBD."
      errori_comuni: []
      permessi:
        - "Documentazione informativa"
    screenshot: []


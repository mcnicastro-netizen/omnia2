        - problema: "Il widget non appare o rende errore CORS"
          soluzione: >
            Verifica allowed_origins della chiave. Se lista vuota →
            no restriction. Se popolata → aggiungi dominio.
      permessi:
        - "Chiunque ha la chiave + Origin autorizzato"

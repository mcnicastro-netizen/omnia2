        Snippet HTML per embed widget OMNIA sul sito partner con
        data-attributes per configurazione.
      quando_si_usa: >
        Integrazione widget Valutatore/Mutui/Lead sul sito partner.
      passi:
        - 'Snippet mostrato in ApiKeysPage docs box:'
        - '<script src="https://{host}/api/widgets/v1/loader.js"'
        - '  data-key="omk_live_..."'
        - '  data-widget="valuator"'

  - id: gruppi.ruoli
    titolo: Super admin Founder vs admin gruppo / agenzia
    modulo: Gruppi
    widget: null
    pubblico: [titolare, super_admin]
    livello: base
    tags: [ruoli, rbac, gruppi, cap24, super-admin, group-admin, agency-admin]
    correlati: [gruppi.creare, api-keys.ruota-chiave-smarrita]
    domanda_naturale: "Le info di gruppo e API key le vede solo il super admin Founder?"
    contenuto:
      a_cosa_serve: >
        Distinguere chi vede Gruppo e API Keys.
      quando_si_usa: >
        Onboarding rete o supporto chiave smarrita.
      passi:
        - "super_admin (Founder OMNIA): vede tutti i gruppi, puo'
          creare/allegare e supportare Ruota API key."
        - "group_admin: vede solo il proprio gruppo in /app/group."
        - "agency_admin: gestisce API key della sua agenzia; non vede
          tutti i gruppi OMNIA."
        - "agent / segreteria: niente menu Gruppo ne API Keys."
      errori_comuni:
        - problema: "L'agente non vede API Keys"
          soluzione: >
            Normale. Solo agency_admin / super_admin (e UI group_admin
            via menu admin).
      permessi:
        - "Vedi tabella Cap. 24.4"
    screenshot: []


  - id: gruppi.creare
    titolo: Come creo un gruppo / holding?
    modulo: Gruppi
    widget: null
    pubblico: [titolare, super_admin]
    livello: base
    tags: [api, create, gruppi, franchising, cap24, real-estate-spa]
    correlati: [gruppi.branch, gruppi.ruoli, gruppi.dove-trovarlo]
    domanda_naturale: "Come creo un gruppo? Posso creare Real Estate Spa da super admin?"
    contenuto:
      a_cosa_serve: >
        Creare un AgencyGroup (holding multi-filiale) con slug e
        credits_mode group|branch.
      quando_si_usa: >
        Avvio rete / franchising / simulazione Founder.
      passi:
        - "UI preferita (D-092): /app/group → form «Crea gruppo»
          (name, franchise opz., credits_mode)."
        - "Ruoli: super_admin, agency_admin o group_admin."
        - "API: POST /api/app/groups con name, franchise_name opzionale,
          credits_mode (group|branch), notes."
        - "Un owner puo' avere un solo gruppo (400 group_already_exists)."
        - "L'agenzia attuale viene auto-collegata come prima filiale."
        - "Poi «Collega filiale» in UI oppure POST /groups/{id}/branches."
      errori_comuni:
        - problema: "group_already_exists"
          soluzione: >
            Hai gia' un gruppo come owner. Usa quello o elimina/cedi
            prima di crearne un altro.
      permessi:
        - "super_admin · agency_admin · group_admin"
    screenshot: []

  - id: gruppi.branch
    titolo: Come aggiungo una sede / filiale al gruppo?
    modulo: Gruppi
    widget: null
    pubblico: [titolare, super_admin]
    livello: base
    tags: [branch, sede, gruppi, cap24, attach]
    correlati: [gruppi.creare, gruppi.kpi]
    domanda_naturale: "Come aggiungo una sede al gruppo?"
    contenuto:
      a_cosa_serve: >
        Collegare un'agenzia esistente come branch del gruppo.
      quando_si_usa: >
        Dopo create gruppo, o quando apri una nuova sede.
      passi:
        - "UI (D-092): bottone «Collega filiale» su /app/group
          (agenzie tue senza group_id + branch_code opz.)."
        - "API: POST /api/app/groups/{id}/branches con agency_id e
          branch_code (es. RES-HQ)."
        - "Solo super_admin puo' attaccare agenzie non proprie."
        - "GET /groups/{id}/branches elenca filiali con KPI locali.
          plan_type legacy fuori catalogo viene normalizzato a hybrid."
      errori_comuni:
        - problema: "403 / branch conflict"
          soluzione: >
            L'agenzia e' gia' in un altro gruppo o non hai permesso
            di attach. Verifica ownership.
      permessi:
        - "super_admin · group_admin del gruppo"
    screenshot: []


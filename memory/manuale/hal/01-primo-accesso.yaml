  - id: primo-accesso.selettore-agenzia
    titolo: Cambiare agenzia attiva (se sei in più agenzie)
    modulo: Primo accesso
    widget: null
    pubblico: [agente, titolare]
    livello: intermedio
    tags: [multi-agenzia, franchising, selettore]
    correlati:
      - primo-accesso.profilo-utente
      - collaboratori.invita-collaboratore
    domanda_naturale: "Sono in due agenzie diverse, come faccio a passare
      dall'una all'altra?"
    contenuto:
      a_cosa_serve: >
        Passare rapidamente da un'agenzia all'altra quando sei membro
        di più agenzie (es. rete franchising, doppio incarico su più
        sedi).
      quando_si_usa: >
        Solo se sei attivo in due o più agenzie. Se sei in una sola
        agenzia, il selettore non compare: è normale.
      passi:
        - Il selettore agenzia compare in alto a sinistra sotto il logo
          OMNIA, ma solo quando sei membro di due o più agenzie.
        - Clicca il selettore.
        - Scegli l'agenzia su cui vuoi lavorare.
        - Da quel momento tutti i dati mostrati (immobili, clienti,
          match) si riferiscono solo all'agenzia attiva. Cambiare
          agenzia non ti fa uscire dall'account.
      errori_comuni:
        - problema: "Non vedo il selettore"
          soluzione: >
            Il selettore appare solo se sei membro di almeno due
            agenzie. Se pensi di doverlo vedere, verifica con il
            titolare dell'altra agenzia che l'invito sia stato
            accettato.
      permessi:
        - Utente presente in due o più agenzie
    screenshot: []


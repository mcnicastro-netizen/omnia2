# HAL — Voci esportate per RAG
# Capitolo 1 · Primo accesso
# Schema:
#   id, titolo, modulo, widget, pubblico, livello, tags, correlati,
#   domanda_naturale, contenuto{ a_cosa_serve, quando_si_usa, passi,
#                                errori_comuni[{problema,soluzione}], permessi },
#   screenshot[]

voci:

  # ---------- 1.1 · Cos'è OMNIA in 3 minuti ----------

  - id: primo-accesso.cosa-e-omnia
    titolo: Cos'è OMNIA in tre minuti
    modulo: Primo accesso
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [orientamento, primi-passi, panoramica, www, d-146]
    correlati:
      - primo-accesso.tour-barra-sinistra
      - hal-agents.introduzione
      - dashboard.panoramica-iniziale
      - api.www-vetrina-landing
    domanda_naturale: "Cos'è OMNIA e cosa ci posso fare?"
    contenuto:
      a_cosa_serve: >
        OMNIA è l'ecosistema che unisce il tuo gestionale ImmoWeb,
        l'assistente intelligente HAL e il portale pubblico ImmobilCloud.
        Da un unico posto gestisci immobili, clienti, portali e sito
        dell'agenzia. Il sito istituzionale www (D-146) spiega Lab +
        Ecosystem; non sostituisce ImmobilCloud per cercare casa.
      quando_si_usa: >
        Ogni giorno per il lavoro operativo. Il primo giorno per
        orientarti. Il manuale ti guida modulo per modulo.
      passi:
        - Al primo login entri automaticamente in ImmoWeb, il gestionale.
        - Nella barra a sinistra trovi tutti i moduli (Dashboard, Immobili,
          Clienti, Match, Portali, Sito web, Impostazioni…).
        - In alto trovi HAL, l'assistente che risponde a domande operative
          e legali.
        - ImmobilCloud è il portale pubblico dove finiscono in vetrina
          gli annunci della tua agenzia; ci arrivano i clienti finali.
        - "www.omniarealestateecosystem.it = vetrina istituzionale (Chi siamo,
          Perché OMNIA, prezzi). Nav www senza Cerca casa — per cercare casa
          usa ImmobilCloud /it/cloud."
      errori_comuni:
        - problema: "Cerco Cerca casa sulla home www"
          soluzione: >
            D-146: non è in nav vetrina. Vai su ImmobilCloud (/it/cloud).
      permessi:
        - Tutti i ruoli
    screenshot:
      - "[SCREEN: cap1-orientamento-generale]"

  # ---------- 1.2 · Login e cambio password ----------

  - id: primo-accesso.login-primo-ingresso
    titolo: Accedere per la prima volta a ImmoWeb
    modulo: Primo accesso
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [login, credenziali, primi-passi]
    correlati:
      - primo-accesso.password-dimenticata
      - primo-accesso.cambiare-password
      - collaboratori.invita-collaboratore
    domanda_naturale: "Come entro in OMNIA la prima volta?"
    contenuto:
      a_cosa_serve: >
        Entrare in ImmoWeb con le credenziali ricevute per email
        (dal titolare o dal servizio OMNIA se hai registrato tu la
        tua agenzia).
      quando_si_usa: >
        Al primo login, appena ricevi l'email di benvenuto o l'invito.
      passi:
        - Apri il link che hai ricevuto per email (indirizzo del tipo
          "https://tua-agenzia.omniarealestateecosystem.it").
        - Se sei stato invitato da un titolare, usa direttamente il link
          nell'email di invito e salta il wizard di onboarding
          (riguarda solo chi apre l'agenzia).
        - Clicca "Accedi" in alto a destra.
        - Scrivi la tua email.
        - Scrivi la password provvisoria.
        - Clicca "Entra".
        - Se è il primo accesso, ti viene chiesto di cambiare la password.
      errori_comuni:
        - problema: "Email o password sbagliata"
          soluzione: >
            Verifica di aver copiato la password senza spazi iniziali o
            finali. Molto spesso, il copia-incolla dalla mail porta uno
            spazio in più.
        - problema: "Il link di invito è scaduto"
          soluzione: >
            Gli inviti scadono dopo 24 ore. Chiedi al titolare di
            re-inviarti l'invito dalla sezione Collaboratori.
        - problema: "Login non entra sull'URL pubblico / tunnel (Safari o Firefox)"
          soluzione: >
            Hard refresh (Safari Cmd+Option+R, Firefox Ctrl+Shift+R).
            Sul tunnel HTTPS i cookie di sessione devono essere Secure:
            il preview OMNIA li imposta. Non è un problema solo Chrome.
            Demo: demo.admin@omniaecosystem.it + DEMO_ADMIN_PASSWORD.
      permessi:
        - Tutti gli utenti che hanno ricevuto un invito o un account
    screenshot:
      - "[SCREEN: cap1-login-form]"

  - id: primo-accesso.google-sign-in
    titolo: Continua con Google (D-134)
    modulo: Primo accesso
    widget: null
    pubblico: [titolare, agente, segreteria, privato]
    livello: base
    tags: [login, google, oauth, d-134, gsi]
    correlati:
      - primo-accesso.login-primo-ingresso
      - primo-accesso.area-riservata-cloud
    domanda_naturale: "Come funziona Continua con Google? Perché invalid_client?"
    contenuto:
      a_cosa_serve: >
        Login/registrazione con Google Identity Services. Richiede
        GOOGLE_CLIENT_ID = OAuth Web Client ID reale su Railway e vault.
      quando_si_usa: >
        Pulsante Continua con Google su /it/login e register cloud.
      passi:
        - "Console Google: consenso External + client Applicazione Web."
        - "Origini JS: apex/www/app/cloud + alias Vercel."
        - "Imposta GOOGLE_CLIENT_ID (…apps.googleusercontent.com) su
          Railway Variables e Cursor Environment; Deploy Railway."
        - "Smoke: GET /api/auth/google/config → enabled true."
      errori_comuni:
        - problema: "401 invalid_client"
          soluzione: >
            Client ID placeholder o non Web. Ricrea client e aggiorna
            Railway+vault (D-134). Vedi GOOGLE_AUTH.md.
        - problema: "Origin non autorizzata"
          soluzione: >
            Aggiungi l'URL esatto della pagina (https, senza path) alle
            origini JavaScript del client OAuth.
      permessi:
        - Pubblico login
    screenshot: []

  - id: primo-accesso.area-riservata-cloud
    titolo: Area riservata ImmobilCloud — Accedi o Crea account (D-131 / D-135 / D-138)
    modulo: Primo accesso
    widget: null
    pubblico: [titolare, agente, segreteria, privato]
    livello: base
    tags: [login, registrazione, cloud, area-riservata, d-131, d-135, d-138, b2c, vendi, logout, telefono, whatsapp]
    correlati:
      - primo-accesso.login-primo-ingresso
      - primo-accesso.password-dimenticata
      - notifiche.inquiry-annuncio-privato
      - notifiche.inbox-venditore-idealista
      - notifiche.logout-b2c-portale
    domanda_naturale: "Dove faccio login sul portale? Cos'è Area riservata? Perché Il mio account non apre nulla? Come esco?"
    contenuto:
      a_cosa_serve: >
        Hub /cloud/area: scelta esplicita Accedi vs Crea account per
        ImmobilCloud B2C (D-131). Anti-duplicati: email già registrata
        → 409 email_already_registered + CTA Accedi. D-135: nav
        «Il mio account» solo per account_type=b2c; sessione agenzia
        vede Area riservata + banner (serve account Privato).
        D-138: tel/WA opzionali in register; Esci in nav/account;
        Messaggi e visite in /cloud/account/messages.
      quando_si_usa: >
        Click Area riservata / Il mio account; primo ingresso privato;
        tentativo di registrarsi con email già usata (B2C o B2B);
        Founder loggato in CRM che vuole vendere da privato; logout.
      passi:
        - "Apri Area riservata → /cloud/area."
        - "Scegli Accedi (login) oppure Crea account (register)."
        - "Opzionale: telefono e WhatsApp in registrazione (D-138)."
        - "Per pubblicare: /cloud/register?intent=sell → /cloud/account/sell
          → Invia per la revisione → IN REVISIONE."
        - "Messaggi inquiry: Account → Messaggi oppure /cloud/account/messages."
        - "Esci: bottone Esci in nav o in Account (solo B2C)."
        - "Se 409 email già registrata: usa Accedi, non creare un secondo account."
        - "Se sei Founder/agenzia: finestra anonima + account B2C (D-135)."
      errori_comuni:
        - problema: "Mi mandava solo a registrazione"
          soluzione: >
            Fix D-131: hub con entrambe le azioni. Redeploy FE Vercel
            se vedi ancora il vecchio comportamento.
        - problema: "Il mio account non risponde / mi rimbalza"
          soluzione: >
            D-135: con sessione gestionale il link non apre la dashboard
            B2C. Usa Area riservata → Crea/Accedi account Privato
            (anonima OK). Hard refresh se cache vecchia.
        - problema: "Mi slogga mentre compilo Vendi"
          soluzione: >
            D-135 CSRF cross-site: refresh esente + header X-CSRF-Token.
            Se ancora succede: hard refresh e ri-login B2C.
        - problema: "Entro in area senza password"
          soluzione: >
            Sessione cookie ancora valida (refresh ~7gg). Usa Esci o
            finestra anonima.
      permessi:
        - Pubblico portale / account esistenti
    screenshot: []

  - id: primo-accesso.home-cloud-tools-mappa
    titolo: Home ImmobilCloud — 4 riquadri, PWA QR→Area e Cerca su mappa (D-139…D-143)
    modulo: Primo accesso
    widget: null
    pubblico: [privato, titolare, agente, segreteria]
    livello: base
    tags: [immobilcloud, home, mappa, cerca-casa, news, scout, pwa, scarica-app, qr, area, d-139, d-141, d-142, d-143, bbox, idealista]
    correlati:
      - primo-accesso.area-riservata-cloud
      - api.portal-news-rss
      - api.cloud-search-bbox-map
    domanda_naturale: "Dove trovo Cerca su mappa? Come scarico l'app ImmobilCloud con QR? Atterro su Accedi o Crea account? Cosa ci sono nei box della home? Perché vedo testo in trasparenza sulla nav?"
    contenuto:
      a_cosa_serve: >
        Orientarsi sulla home ImmobilCloud: 4 riquadri Scout · Cerca su
        mappa · Scarica app · News. QR → Area Accedi/Crea (?from=pwa) +
        Installa (D-143). Scout in evidenza in Cerca e Vendi (D-142).
        Visura e HAL Legal solo in nav. Nav sticky opaca (no bleed hero).
      quando_si_usa: >
        Visitatore su /cloud; scan QR da computer; install icona telefonino;
        ricerca mappa; Scout prima di visita o in Vendi.
      passi:
        - "Home → tile Scarica app → /cloud/app (guida + QR)."
        - "Dal PC: inquadra il QR → /cloud/area?from=pwa (Accedi | Crea)."
        - "Su Area: striscia Installa; Android dialog nativo."
        - "Su iPhone: Condividi → Aggiungi a Home (limite Apple)."
        - "Tile Cerca su mappa → /cloud/search?view=map."
        - "Cerca / Vendi: banner Scout in evidenza."
        - "HAL Legal e Visura: voci nav (non tile home)."
      errori_comuni:
        - problema: "Non trovo HAL Legal / Visura nei 4 box"
          soluzione: >
            Voluto (D-141/D-142): sono in nav. I 4 box sono Scout, Mappa,
            Scarica app, News.
        - problema: "Su iPhone non appare Installa"
          soluzione: >
            Apple non permette install silenziosa. Su /cloud/app o dalla
            striscia Area → guida Condividi → Aggiungi a Home. Serve HTTPS.
        - problema: "Il QR non apre Accedi/Crea account"
          soluzione: >
            Deve puntare a …/it/cloud/area?from=pwa (non solo /cloud/app).
            Hard refresh; fotocamera o app QR.
        - problema: "Testo fantasma / trasparente sulla nav"
          soluzione: >
            Bug sticky nav semitrasparente (fix PR #106): hard refresh.
            Nav ora cream opaca.
        - problema: "Non vedo Cerca su mappa"
          soluzione: >
            Hard refresh FE. Home tile oppure box sotto i filtri in lista.
            URL /it/cloud/search?view=map.
      permessi:
        - Pubblico portale
    screenshot: []

  - id: primo-accesso.password-dimenticata
    titolo: Recuperare la password dimenticata
    modulo: Primo accesso
    widget: null
    pubblico: [titolare, agente, segreteria, privato]
    livello: base
    tags: [password, recupero, sicurezza, resend, d-132, d-161]
    correlati:
      - primo-accesso.login-primo-ingresso
      - primo-accesso.cambiare-password
      - primo-accesso.registrazione-b2b-gestionale
      - notifiche.template-welcome-password
    domanda_naturale: "Ho dimenticato la password, come faccio?"
    contenuto:
      a_cosa_serve: >
        Recovery unica per tutti i ruoli (privato, agente, admin,
        Founder) via POST /api/auth/forgot-password. Vale anche per
        titolari B2B (D-161: una sola password di register). Email da
        OMNIA <info@omniarealestateecosystem.it> (D-132).
      quando_si_usa: >
        Login fallisce e non ricordi la password — in registrazione,
        in sala d'attesa, o dopo Attiva.
      passi:
        - Dalla schermata di accesso clicca "Password dimenticata".
        - Scrivi la tua email.
        - Clicca "Invia link di recupero".
        - Controlla la posta (mittente info@omniarealestateecosystem.it;
          arriva entro un paio di minuti, guarda anche in Spam).
        - Apri la mail e clicca il link.
        - Imposta una nuova password (almeno 8 caratteri, con una
          maiuscola e un numero).
        - Torna alla schermata di accesso ed entra con la nuova password.
      errori_comuni:
        - problema: "Non arriva la mail di recupero"
          soluzione: >
            Controlla Spam. Ops: SENDER_EMAIL non deve essere
            onboarding@resend.dev (sandbox). Vedi Cap.18 / D-132.
        - problema: "Il link nella mail non funziona"
          soluzione: >
            I link di recupero scadono dopo un'ora. Rifai la procedura
            dall'inizio e apri subito il nuovo link.
      permessi:
        - Chiunque abbia un account
    screenshot:
      - "[SCREEN: cap1-forgot-password]"

  - id: primo-accesso.cambiare-password
    titolo: Cambiare o recuperare la password
    modulo: Primo accesso
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [password, profilo, sicurezza, d-161, forgot-password]
    correlati:
      - primo-accesso.password-dimenticata
      - primo-accesso.profilo-utente
      - primo-accesso.registrazione-b2b-gestionale
    domanda_naturale: "Come cambio la password? E se non la ricordo?"
    contenuto:
      a_cosa_serve: >
        Con D-161 la password di registrazione è quella di login.
        Se non la ricordi: Password dimenticata su login. Se sei
        dentro: puoi cambiarla da profilo/sicurezza o
        POST /auth/me/change-password.
      quando_si_usa: >
        Password dimenticata, rotazione sicurezza, o sospetto accesso.
      passi:
        - "Non la ricordi: login → Password dimenticata? → email con
          link → nuova password (min 8) → Entra."
        - "Sei loggato: nome in alto a destra → Profilo → Sicurezza →
          Cambia password (attuale + nuova) → Salva."
      errori_comuni:
        - problema: "Non arriva l'email di reset"
          soluzione: >
            Controlla spam; attendi un minuto; riprova. Il link scade
            (tipicamente 1 ora).
        - problema: "La nuova password è rifiutata"
          soluzione: >
            Almeno 8 caratteri. Evita spazi.
      permessi:
        - Tutti gli utenti autenticati
    screenshot: []

  # ---------- 1.3 · Onboarding agenzia ----------

  - id: primo-accesso.registrazione-b2b-gestionale
    titolo: Registrare una nuova agenzia (pacchetto, KYC, una password)
    modulo: Primo accesso
    widget: null
    pubblico: [titolare]
    livello: base
    tags: [registrazione, b2b, d-157, d-158, d-159, d-160, kyc, stripe, api-key]
    correlati:
      - primo-accesso.onboarding-agenzia
      - primo-accesso.password-dimenticata
      - primo-accesso.cambiare-password
      - api-keys.emissione-show-once
      - api.cabina-attivazione-3-passi
    domanda_naturale: "Come registro la mia agenzia su OMNIA? Che password uso?"
    contenuto:
      a_cosa_serve: >
        Aprire un account gestionale B2B: pacchetto, una password,
        anagrafica e documenti, pagamento, Attiva Ops sblocca il CRM.
        Stessa password dal register al login (D-161).
      quando_si_usa: >
        Prima apertura agenzia su OMNIA (D-157…D-161).
      passi:
        - "Scegli Starter / Pro / Agency (3 box) su /it/register → form."
        - "Nome, email e password (min 8) — resta quella di login (D-161)."
        - "Completa onboarding; email 'richiesta ricevuta' solo a fine
          wizard (D-160)."
        - "Logo file facoltativo se hai già sito/dominio (D-158)."
        - "Sala d'attesa: visura + CI (anteprima) + Stripe."
        - "Ops Attiva (3 passi) → email 'gestionale attivo'; login con
          la stessa password. API keys solo da Impostazioni se servono."
        - "Se chiudi a metà: login con la password o Password dimenticata."
      errori_comuni:
        - problema: "Non riesco a fare login appena registrato"
          soluzione: >
            Usa la password scelta in register.
        - problema: "Mi arrivano email troppo presto"
          soluzione: >
            D-160: a register non parte mail. Solo pending a fine
            onboarding e activated a Attiva.
        - problema: "L'upload logo/documenti sembra fallire"
          soluzione: >
            Usa PDF/PNG/JPG/WebP (no HEIC iPhone). Anteprima dopo upload.
      permessi:
        - Nuovo titolare in registrazione
    screenshot: []

  - id: primo-accesso.onboarding-agenzia
    titolo: Configurare l'agenzia al primo accesso (wizard + sala d'attesa)
    modulo: Primo accesso
    widget: null
    pubblico: [titolare]
    livello: base
    tags: [onboarding, configurazione, agenzia, primi-passi, d-157, d-158]
    correlati:
      - primo-accesso.registrazione-b2b-gestionale
      - impostazioni.dati-fiscali
      - sito-web.brand-studio
      - primo-accesso.tour-barra-sinistra
    domanda_naturale: "Come configuro la mia agenzia la prima volta?"
    contenuto:
      a_cosa_serve: >
        Impostare anagrafica agenzia e arrivare alla sala d'attesa KYC/pagamento.
        Il CRM si sblocca solo dopo Attiva Ops.
      quando_si_usa: >
        Subito dopo la registrazione B2B del titolare.
      passi:
        - "Passo 1 · Identità: nome commerciale."
        - "Passo 2 · Fiscale/contatti: ragione sociale, P.IVA, CF, REA,
          indirizzo, email, telefono, PEC, sito web. Niente FIAIP in UI."
        - "Passo 3 · Branding: logo file opzionale se c'è già il sito;
          colori; tagline."
        - "Invio → agenzia pending → sala d'attesa (visura, CI, Stripe)."
      errori_comuni:
        - problema: "Partita IVA non valida"
          soluzione: >
            Deve essere 11 cifre senza spazi né trattini.
        - problema: "Mi chiede il logo ma ho già il sito"
          soluzione: >
            D-158: con sito/dominio indicato puoi continuare senza file logo.
        - problema: "Ho sbagliato la ragione sociale"
          soluzione: >
            Correggibile in qualsiasi momento da Impostazioni → Dati
            fiscali (dopo attivazione).
      permessi:
        - Solo titolare (agency_admin dopo create)
    screenshot:
      - "[SCREEN: cap1-onboarding-step4-conferma]"

  # ---------- 1.4 · Tour della barra a sinistra ----------

  - id: primo-accesso.tour-barra-sinistra
    titolo: Cosa contiene la barra a sinistra
    modulo: Primo accesso
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [navigazione, sidebar, orientamento]
    correlati:
      - dashboard.panoramica-iniziale
      - immobili.creazione-manuale
      - clienti.anagrafica-nuovo-cliente
    domanda_naturale: "Cosa c'è nel menu di sinistra di ImmoWeb?"
    contenuto:
      a_cosa_serve: >
        Sapere dove trovare ogni modulo. La barra a sinistra è l'indice
        del gestionale: da qui apri Dashboard, Immobili, Clienti, Match,
        Portali, Sito web, Virtual Staging, Mutui, HAL Legal, HAL
        Knowledge, Collaboratori, Piano & Crediti e Impostazioni.
      quando_si_usa: >
        Ogni volta che devi cambiare modulo di lavoro.
      passi:
        - "Dashboard: pannello iniziale con sei numeri chiave
          (immobili attivi, lead aperti, match, visite, collaboratori,
          inviti pendenti) — tutti."
        - "Gruppo: gestione filiali per reti multi-sede (solo tier
          Agency, solo titolare/capogruppo)."
        - "API Keys, Importa, Portali, Sito web: strumenti di gestione
          avanzata, visibili solo al titolare."
        - "Immobili, Clienti, Match: uso quotidiano operativo (tutti)."
        - "Virtual Staging, Mutui, HAL Legal, HAL Knowledge:
          strumenti AI e servizi (tutti). HAL Knowledge risponde
          alle domande su come usare la piattaforma (corpus manuale
          già indicizzato)."
        - "Collaboratori: gestione dei membri (visibile a tutti, solo
          il titolare può invitare o revocare)."
        - "Piano & Crediti, Impostazioni: amministrazione (solo
          titolare)."
      errori_comuni:
        - problema: "Non vedo alcune voci"
          soluzione: >
            Le voci non accessibili al tuo ruolo semplicemente non
            compaiono. Non è un bug. Se pensi di dover vedere una voce
            in più, chiedi al titolare di rivedere i tuoi permessi.
        - problema: "Sono su cellulare e non vedo la barra"
          soluzione: >
            Su schermi piccoli la barra diventa un menu con l'icona ☰
            in alto a sinistra.
      permessi:
        - Tutti (contenuto visibile in base al ruolo)
    screenshot:
      - "[SCREEN: cap1-sidebar-completa]"

  # ---------- 1.5 · Cambio lingua e profilo utente ----------

  - id: primo-accesso.cambio-lingua
    titolo: Cambiare la lingua dell'interfaccia
    modulo: Primo accesso
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [lingua, interfaccia, i18n]
    correlati:
      - primo-accesso.profilo-utente
    domanda_naturale: "Come cambio la lingua di ImmoWeb?"
    contenuto:
      a_cosa_serve: >
        Usare OMNIA in italiano, inglese o spagnolo, ad esempio quando
        gestisci clienti stranieri o hai un collaboratore che preferisce
        un'altra lingua.
      quando_si_usa: >
        In qualsiasi momento. Il cambio lingua è personale, non modifica
        la lingua di altri utenti né dei clienti sul portale pubblico.
      passi:
        - In alto a destra clicca la sigla della lingua attuale (IT, EN
          o ES).
        - Nel menu a tendina scegli la lingua che ti serve.
        - La pagina si ricarica nella nuova lingua.
      errori_comuni:
        - problema: "Alcune scritte non sono tradotte"
          soluzione: >
            Se noti una scritta rimasta in un'altra lingua, segnalalo:
            aggiorniamo continuamente i testi. In genere sono termini
            tecnici o messaggi rari.
      permessi:
        - Tutti

  - id: sito.mls-on-off
    titolo: MLS on/off sul sito white-label (D-149)
    modulo: Sito web
    widget: null
    pubblico: [titolare, super_admin]
    livello: base
    tags: [sito-web, mls, d-149, white-label, mls-box]
    correlati:
      - sito.temi-disponibili
      - sito.clone-d023-d130
      - mls.join
      - mls.pubblico
    domanda_naturale: "Il sito dell'agenzia mostra anche gli immobili MLS?"
    contenuto:
      a_cosa_serve: >
        Con mls_enabled=true la home mostra box ricerca rete + sezione
        Immobili dalla Rete MLS Partner. Con false solo search portafoglio;
        embed /api/mls-box/* risponde mls_not_enabled. Il theme_id non cambia.
      quando_si_usa: >
        Dopo join/leave MLS, o in migrazione casi 1–2 (D-149).
      passi:
        - "Caso 1: entra in MLS → home con pezzi rete."
        - "Caso 2: POST /app/mls/leave → zero pezzi MLS sul sito."
        - "Ogni tema gallery 8 deve passare QA on|off (D-150)."
      errori_comuni:
        - problema: "Ho lasciato MLS ma vedo ancora il box rete"
          soluzione: >
            Verifica mls_enabled false e hard-refresh; embed deve dare
            mls_not_enabled.
      permessi:
        - Titolare (join/leave) · pubblico vede solo pezzi consentiti
    screenshot: []

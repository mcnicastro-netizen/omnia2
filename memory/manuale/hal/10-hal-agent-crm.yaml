# HAL — Voci esportate per RAG
# Capitolo 10 · HAL Agent CRM
# Nota naming: usiamo SOLO "HAL" / "HAL Agent" nei titoli, contenuti, domande.
# Nel codice sorgente restano i nomi legacy al_agent.py, AlChatWidget, ecc.

voci:

  - id: hal.cos-e
    titolo: Cos'è HAL Agent e dove lo trovi nel CRM
    modulo: HAL Agent
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [hal, hal-agent, chat, ai, panoramica, primi-passi]
    correlati:
      - hal.chat-aprire
      - hal.improve-titolo-descrizione
      - hal.limiti-cosa-non-fa
    domanda_naturale: "Cos'è HAL Agent in OMNIA?"
    contenuto:
      a_cosa_serve: >
        Assistente AI di OMNIA integrato nel CRM. Due punti di contatto:
        chat widget flottante (bottone in basso a destra su ogni pagina
        ImmoWeb) e pulsante 'Migliora con HAL' inline nei form immobile
        (titolo/descrizione, multi-lingua IT/EN/ES).
      quando_si_usa: >
        Ogni volta che vuoi interrogare il CRM (immobili/clienti/lead),
        chiedere KPI mensili, generare descrizioni per annunci o
        migliorare titoli.
      passi:
        - "Chat widget: clicca il cerchio HAL in basso a destra (test-id
          al-fab) da qualsiasi pagina ImmoWeb."
        - "Si apre pannello 380x580 px con storico messaggi e area
          input."
        - "Pulsante Migliora con HAL: appare inline nel form immobile
          (PropertyForm ImmoWeb + SellPage B2C) accanto ai campi
          Titolo annuncio e Descrizione."
        - "Modello LLM: Gemini 3 Flash Preview via Emergent LLM Key.
          Temperatura 0.2 deterministica per accuratezza CRM."
        - "Chi puo' usarlo: titolare, agente, segreteria (mai utente
          esterno/pubblico)."
      errori_comuni:
        - problema: "Non vedo il bottone HAL in basso a destra"
          soluzione: >
            Sei loggato ma su una pagina non-ImmoWeb (es. B2C /cloud).
            Il chat widget appare solo dentro ImmoWeb. Vai in
            /it/app/dashboard e sara' visibile.
      permessi:
        - Titolare, agente, segreteria (utenti autenticati agenzia)
    screenshot:
      - "[SCREEN: cap10-hal-chat-widget]"

  - id: hal.chat-aprire
    titolo: Come apro la chat con HAL
    modulo: HAL Agent
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [hal, chat, come-fare, streaming, sessione]
    correlati:
      - hal.cos-e
      - hal.tool-crm
      - hal.rate-limit-chat
    domanda_naturale: "Come apro e uso la chat HAL?"
    contenuto:
      a_cosa_serve: >
        Aprire la chat AI per interrogare il CRM, farsi comporre
        descrizioni, chiedere KPI.
      quando_si_usa: >
        Ogni volta che serve una risposta veloce senza aprire pagine
        multiple.
      passi:
        - "Su qualsiasi pagina ImmoWeb, clicca il cerchio HAL in basso
          a destra (al-fab)."
        - "Si apre il pannello chat sopra il contenuto."
        - "Scrivi la domanda in italiano nell'area input (al-input),
          max 2000 caratteri."
        - "Clicca Invia (al-send) o premi Invio."
        - "HAL risponde in streaming (token-by-token) con badge
          'Sto pensando...' o 'Consulto {tool}...' se serve query CRM."
        - "Puoi interrompere una risposta lunga con Stop (al-stop)."
        - "Per iniziare una nuova conversazione: bottone Nuova sessione
          (al-new-session)."
      errori_comuni:
        - problema: "La chat non risponde e vedo errore llm_key_not_configured (503)"
          soluzione: >
            La chiave EMERGENT_LLM_KEY non e' configurata nell'ambiente.
            Contatta l'assistenza. Se sei in preview locale, verifica
            backend/.env.
        - problema: "Errore llm_budget_exceeded (503)"
          soluzione: >
            Budget Universal Key finito. Vai in Piano & Crediti ->
            Universal Key -> Aggiungi saldo.
        - problema: "La risposta arriva monca / si interrompe"
          soluzione: >
            Rete instabile o Stop cliccato. Rilancia la domanda, i
            messaggi gia' salvati restano persistiti.
      permessi:
        - Titolare, agente, segreteria
    screenshot: []

  - id: hal.tool-crm
    titolo: I 5 tool CRM whitelist di HAL (query only)
    modulo: HAL Agent
    widget: null
    pubblico: [titolare, agente]
    livello: intermedio
    tags: [hal, tool, crm, query, whitelist, sola-lettura]
    correlati:
      - hal.chat-aprire
      - hal.limiti-cosa-non-fa
    domanda_naturale: "Cosa sa cercare HAL nel mio CRM?"
    contenuto:
      a_cosa_serve: >
        Sapere quali 5 tool HAL puo' invocare per interrogare il CRM.
        Sono tutti SOLA LETTURA e agency-scoped (agency_id auto-injected).
      quando_si_usa: >
        Quando formuli una domanda a HAL e vuoi capire se puo'
        soddisfarla.
      passi:
        - "TOOL 1 - query_properties: filtri city, property_type,
          operation, status, price_max. Ritorna max 15 immobili.
          Esempio: 'Quali trilocali attivi a Milano sotto 300k?'"
        - "TOOL 2 - query_clients: filtri client_type, status, source,
          name. Ritorna max 15 clienti. Esempio: 'Chi sono i miei
          venditori attivi?'"
        - "TOOL 3 - query_leads: filtri status, since_days, min_score.
          Ritorna max 15 lead. Esempio: 'Lead caldi degli ultimi 7
          giorni?'"
        - "TOOL 4 - monthly_performance: nessun filtro. Ritorna KPI
          ultimi 30 giorni (new_properties, active_properties,
          new_clients, new_leads, hot_leads_open). Esempio: 'Come
          sono andato questo mese?'"
        - "TOOL 5 - write_description: property_id obbligatorio, tone
          opzionale (standard/lusso/giovane). Ritorna dati immobile
          confezionati per generazione descrizione."
        - "AGENCY SCOPING: ogni tool inietta il tuo agency_id dalla
          sessione autenticata. Non puoi chiedere immobili di altre
          agenzie, HAL vede solo la tua (multi-tenant safe by design)."
      errori_comuni:
        - problema: "Ho chiesto a HAL di eliminare un lead, non lo fa"
          soluzione: >
            Comportamento atteso. HAL e' SOLA LETTURA. Non esistono
            tool di scrittura (update/delete/create) in v1. Vai in
            Clienti/Lead e opera manualmente.
        - problema: "HAL cita immobili sbagliati / di altra agenzia"
          soluzione: >
            Impossibile in ambienti sani. Se accade, agency_id non
            e' iniettato correttamente - contatta assistenza subito.
      permessi:
        - Titolare, agente (dati CRM filtrati per privacy L1-L4)
    screenshot:
      - "[SCREEN: cap10-hal-chat-tool]"

  - id: hal.pipeline-tool-call
    titolo: Come HAL decide di usare un tool CRM (pipeline)
    modulo: HAL Agent
    widget: null
    pubblico: [titolare, agente]
    livello: intermedio
    tags: [hal, pipeline, tool-use, gemini, json, streaming, sse]
    correlati:
      - hal.tool-crm
      - hal.chat-aprire
    domanda_naturale: "Come fa HAL a capire quando deve consultare il CRM?"
    contenuto:
      a_cosa_serve: >
        Capire cosa succede sotto il cofano per debug e trasparenza.
      quando_si_usa: >
        Utile a titolare/agente esperto per capire perche' HAL a volte
        e' veloce (no CRM) e altre volte lento (con CRM + follow-up).
      passi:
        - "1. Il tuo messaggio va a Gemini 3 Flash col SYSTEM_PROMPT
          di HAL."
        - "2a. Ciclo semplice (no CRM): Gemini risponde in italiano
          direttamente."
        - "2b. Ciclo con tool: Gemini risponde con JSON tipo
          {'tool': 'query_properties', 'params': {'city': 'Milano'}}."
        - "3. Il backend valida il JSON (parser tollerante gestisce
          fence ```json e testo prima/dopo), verifica whitelist."
        - "4. Backend esegue query MongoDB con agency_id auto-injected."
        - "5. Il risultato viene rimandato a Gemini come follow-up
          'Risultato del tool X: {...}. Componi ora la risposta finale
          in italiano.'"
        - "6. Gemini compone risposta naturale."
        - "STREAMING SSE: 6 eventi (session, thinking, tool, token,
          done, error). L'utente vede la risposta arrivare in tempo
          reale (~1s invece di 5-15s completi)."
      errori_comuni:
        - problema: "Il badge 'Consulto {tool}' resta appeso senza risposta"
          soluzione: >
            Il tool CRM ha fallito silenziosamente. HAL emette
            'Ho provato a consultare {tool} ma ho avuto un problema.
            Riprova'. Rilancia la domanda.
        - problema: "HAL emette JSON in output e non testo"
          soluzione: >
            Il JSON era malformato e il parser tollerante non l'ha
            riconosciuto come tool call. Comportamento raro. Rilancia
            riformulando la domanda.
      permessi:
        - Titolare, agente (dettagli tecnici utili)
    screenshot: []

  - id: hal.rate-limit-chat
    titolo: Limite orario chat HAL (60 messaggi/ora)
    modulo: HAL Agent
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [hal, rate-limit, quota, anti-abuso, chat]
    correlati:
      - hal.chat-aprire
      - hal.rate-limit-improve
    domanda_naturale: "Quanti messaggi HAL posso mandare all'ora?"
    contenuto:
      a_cosa_serve: >
        Sapere il tetto anti-abuso per pianificare sessioni intense.
      quando_si_usa: >
        Se prevedi molte domande consecutive (es. sessione di analisi
        portafoglio).
      passi:
        - "60 messaggi chat/ora/utente (SOFT_RATE_LIMIT=60)."
        - "Contatore SEPARATO da quello del pulsante Migliora con HAL
          (che ha il suo tetto di 60/ora). NON sono condivisi in v1:
          chat 60/h AND improve 60/h contati indipendentemente."
        - "Finestra scorrevole basata su ts audit (una hour ago da
          adesso)."
        - "Al 61esimo messaggio nella finestra -> HTTP 429
          'rate_limit_exceeded'."
      errori_comuni:
        - problema: "429 rate_limit_exceeded dopo pochi messaggi"
          soluzione: >
            Verifica se hai una sessione stream ancora aperta che sta
            contando male. Chiudi la chat con Nuova sessione e riprova.
            Oppure attendi 15-30 min.
        - problema: "Il limite riparte all'ora piena?"
          soluzione: >
            No, finestra scorrevole. Il primo messaggio conteggiato
            scade dopo esattamente 1 ora dall'inserimento.
      permessi:
        - Titolare, agente, segreteria
    screenshot: []

  - id: hal.improve-titolo-descrizione
    titolo: Pulsante 'Migliora con HAL' - titolo e descrizione
    modulo: HAL Agent
    widget: null
    pubblico: [titolare, agente]
    livello: base
    tags: [hal, improve, migliora, titolo, descrizione, copywriting, form]
    correlati:
      - hal.improve-lingue-toni
      - hal.rate-limit-improve
      - immobili.creazione-manuale
    domanda_naturale: "A cosa serve il pulsante 'Migliora con HAL' nei form?"
    contenuto:
      a_cosa_serve: >
        Rigenerare o migliorare in un click il titolo o la descrizione
        di un annuncio immobiliare, coerente coi dati del form. Endpoint
        dedicato /api/app/al/improve (separato dalla chat).
      quando_si_usa: >
        Ogni volta che stai creando/modificando un immobile in
        PropertyForm (ImmoWeb) o SellPage (B2C privati) e vuoi un
        testo professionale rapido.
      passi:
        - "Compila prima possibile i dati dell'immobile (tipologia,
          citta', superficie, locali, features): piu' dati -> migliore
          l'output."
        - "Clicca ✨ 'Migliora con HAL' accanto al campo Titolo o
          Descrizione (test-id al-improve-{title|description}-trigger)."
        - "Si apre una modale con: testo attuale a sinistra, selettore
          lingua IT/EN/ES, bottone Genera (o auto-genera all'apertura),
          testo migliorato a destra."
        - "Al termine puoi cliccare Applica per sostituire il campo,
          oppure chiudere la modale."
        - "REGOLE OUTPUT: Titolo max 80 caratteri (tipologia + zona/citta'
          + 1-2 punti forza, no prezzo, no emoji, no virgolette).
          Descrizione 600-1200 caratteri (attacco + locali/finiture +
          zona/servizi + classe energetica, paragrafi fluidi, no bullet,
          no prezzo, no emoji)."
      errori_comuni:
        - problema: "L'output ha prefissi tipo 'Titolo:' o virgolette"
          soluzione: >
            Un sanitizer server-side rimuove code fence, prefissi
            comuni ('Titolo:', 'Description:', 'Título:') e virgolette
            wrapping. Se ancora vedi prefissi, segnala all'assistenza
            (bug del sanitizer).
        - problema: "L'output contiene un prezzo o email inventato"
          soluzione: >
            Il system prompt vieta prezzi/telefoni/email/URL. Se
            appaiono e' un bug: segnala all'assistenza con screenshot.
      permessi:
        - Titolare, agente (chi puo' modificare l'immobile)
    screenshot:
      - "[SCREEN: cap10-hal-improve-modal]"

  - id: hal.improve-lingue-toni
    titolo: Lingue e toni del pulsante Migliora con HAL
    modulo: HAL Agent
    widget: null
    pubblico: [titolare, agente]
    livello: base
    tags: [hal, improve, lingue, toni, italiano, inglese, spagnolo, lusso, giovane]
    correlati:
      - hal.improve-titolo-descrizione
    domanda_naturale: "Quali lingue e toni supporta 'Migliora con HAL'?"
    contenuto:
      a_cosa_serve: >
        Scegliere lingua e tono coerente col target buyer dell'annuncio.
      quando_si_usa: >
        Sempre quando apri il modale Migliora con HAL.
      passi:
        - "LINGUE: it (italiano - default), en (inglese), es (spagnolo).
          Selettore in modale (test-id al-improve-{field}-lang-
          {it|en|es})."
        - "TONI: standard (professionale, chiaro, real estate moderno
          italiano). lusso (elegante, lessico premium, esclusivita').
          giovane (dinamico, fresco, friendly, colloquiale)."
        - "Tono standard e' il default nel bottone. Per lusso/giovane
          in v1 e' possibile impostarlo solo via chat scritta ('Scrivi
          descrizione tono lusso per RIF-124')."
      errori_comuni:
        - problema: "Voglio francese/tedesco/portoghese"
          soluzione: >
            Non supportati in v1. Il pattern regex accetta solo it/en/
            es (Pydantic ImproveRequest). Roadmap: aggiunta DE/FR/PT.
        - problema: "Voglio tono 'ironico' o 'formale-notarile'"
          soluzione: >
            Non supportati. In v1 solo standard/lusso/giovane. Se serve
            un tono custom, edita manualmente il testo dopo la
            generazione.
      permessi:
        - Titolare, agente
    screenshot: []


    contenuto:
      a_cosa_serve: >
        Risolvere rapidamente errori comuni senza aprire ticket.
      quando_si_usa: >
        Ogni volta che vedi un errore nella chat.
      passi:
        - "503 llm_key_not_configured: chiave EMERGENT_LLM_KEY non
          impostata. Contatta assistenza."
        - "503 llm_budget_exceeded: budget Universal Key finito. Piano
          & Crediti -> Universal Key -> Aggiungi saldo."
        - "503 llm_unavailable: errore transitorio Gemini o timeout.
          Riprova tra 5-15 secondi."
        - "429 rate_limit_exceeded: >60 messaggi in 1 ora. Attendi
          finestra scorrevole."
        - "'Non ho questa informazione nel tuo CRM': tool CRM non ha
          trovato dati. Verifica formulazione della domanda."
        - "'Ho provato a consultare {tool} ma ho avuto un problema.
          Riprova': tool fallito silenziosamente (DB timeout o simile).
          Rilancia."
        - "HAL cita immobili di altra agenzia: impossibile in ambienti
          sani. Contatta assistenza SUBITO."
        - "HAL non risponde a domanda legale: comportamento voluto
          (system prompt). Usa HAL Legal (in arrivo) o consulta
          notaio."
      errori_comuni:
        - problema: "429 rate_limit_exceeded ma ho fatto pochi messaggi"
          soluzione: >
            Puoi aver aperto piu' tab chat in parallelo. Chiudi tutte
            le sessioni aperte e riprova con Nuova sessione.
        - problema: "HAL risponde con JSON invece di testo"
          soluzione: >
            Il parser tollerante non ha riconosciuto il JSON come tool
            call. Rilancia riformulando la domanda in modo piu' diretto.
      permessi:
        - Titolare, agente, segreteria

    domanda_naturale: "Quante volte all'ora posso usare 'Migliora con HAL'?"
    contenuto:
      a_cosa_serve: >
        Sapere il tetto orario per il pulsante Migliora, distinto
        dal tetto chat.
      quando_si_usa: >
        Se prevedi di lavorare su molti annunci di fila in una sessione.
      passi:
        - "60 chiamate improve/ora/utente (SOFT_RATE_LIMIT=60)."
        - "Contatore SEPARATO da quello della chat: chat 60/h AND
          improve 60/h contati indipendentemente in v1."
        - "Finestra scorrevole basata su ts audit + kind='improve'."
        - "Al 61esima chiamata -> HTTP 429 'rate_limit_exceeded'."

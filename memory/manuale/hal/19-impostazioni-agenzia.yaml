  # ---------- 19.13 · Limitazioni v1 ----------

  - id: settings.limitazioni-v1
    titolo: Limiti v1 Impostazioni agenzia (D-051 onesto · elenco esaustivo)
    modulo: Impostazioni
    widget: null
    pubblico: [titolare, agente, super_admin]
    livello: intermedio
    tags: [impostazioni, limiti, cosa-non-fa, no-uploader-logo, no-color-picker, no-rea, no-fiaip, no-country-selector, no-geocoding, no-validazione-vat, no-transfer-ownership, no-audit-settings, template-stub, d-051]
    correlati: [settings.cos-e, settings.chi-non-e-coperto]
    domanda_naturale: "Cosa NON fa la Settings v1? Ha uploader logo, color picker, validazione VAT, transfer ownership, geocoding indirizzo, audit trail modifiche, rollback?"
    contenuto:
      a_cosa_serve: >
        Elenco esaustivo di cosa la Settings v1 NON fa, rispettando
        Onesta' Documentale D-051.
      quando_si_usa: >
        Prima di aspettarti uploader logo, color picker, o audit trail
        delle modifiche.
      passi:
        - "CAMPI SCHEMA-ONLY (nessuna UI di modifica): branding.logo_url
          (no uploader), branding.primary_color (default #0B1E3F),
          branding.accent_color (default #1F6B5C), fiscal.rea,
          fiscal.fiaip_code, contact.website (duplicato di
          website.external_url), address.country (default IT hard-
          coded), plan_type (turnkey/whitelabel/hybrid — decisione
          backend), group_id / branch_code (franchising M2.5.1)."
        - "TEMPLATE OMNIA STUB: preview minimal/elegant/bold marcati
          'presto disponibile'. Nessun template_id selezionabile via
          UI v1. Nessun rendering template attivo (Cap. 8 usa sito
          esterno o brand extracted)."
        - "VALIDAZIONI MANCANTI: no formato Partita IVA IT (11 cifre),
          no formato Codice Fiscale IT (16 char), no unicita' VAT tra
          agenzie, no autocomplete Google Places indirizzo, no
          geocoding lat/lng, no validazione CAP contro database CAP,
          no validazione telefono formato IT/internazionale."
        - "SEZIONI NON PRESENTI (pagine separate): Team (Cap. 13),
          Billing (§19.10), Domain Vault (Cap. 17), API Keys (Track B
          futuro), Notifiche preferenze (Cap. 18 no UI v1), Log audit
          settings, cambio password/MFA/sessioni."
        - "OPERAZIONI NON SUPPORTATE: no trasferimento ownership
          agenzia (owner_id immutabile), no rinomina slug pubblico
          (slug creato all'onboarding), no import/export JSON
          impostazioni, no storico modifiche settings (no audit trail),
          no rollback modifica errata (no undo), no anteprima 'come
          apparira' prima di salvare (no preview render)."
        - "TOAST/UX: il toast successo NON usa libreria sonner (Cap.
          18) — usa banner emerald embedded locale al form. Autoazzera
          dopo 2500ms (non configurabile). No undo dopo save (Ctrl+Z
          non funziona). Errori mostrati come banner rosso persistente."
      errori_comuni:
        - problema: "Voglio un uploader logo con drag&drop"
          soluzione: >
            v1 NO uploader. Backlog A-025 (v1.1). Usa Cap. 8 brand
            extractor per popolare logo automaticamente dal sito
            esistente.
        - problema: "Voglio validare la Partita IVA prima di salvare"
          soluzione: >
            v1 NO validazione formato/checksum P.IVA. Backlog v1.1.
      permessi:
        - "N/A · limitazioni informative"
    screenshot: []

  # ---------- 19.14 · Collegamenti ----------

  - id: settings.collegamenti
    titolo: Collegamenti Settings → altri capitoli (Cap. 1/6/8/13/17/18)
    modulo: Impostazioni
    widget: null
    pubblico: [titolare, super_admin]
    livello: base
    tags: [impostazioni, collegamenti, cross-ref, cap1, cap6, cap8, cap13, cap17, cap18]
    correlati: [settings.cos-e, settings.chi-non-e-coperto]
    domanda_naturale: "Come si integra la Settings con gli altri moduli di OMNIA?"
    contenuto:
      a_cosa_serve: >
        Mappa dei collegamenti Settings → altri moduli documentati.
      quando_si_usa: >
        Quando devi risalire da un campo Settings al modulo che lo
        consuma.
      passi:
        - "Cap. 1 Primo accesso: onboarding crea l'agency con
          display_name + fiscal.legal_name. La Settings poi permette
          di modificarli."
        - "Cap. 3 Immobili: le proprieta' pubblicate ereditano
          agency.address per il portale pubblico."
        - "Cap. 6 Portali / Publishing: il feed XML espone
          contact.email e contact.phone ai portali."
        - "Cap. 8 Sito web agenzia: website.mode='external' →
          Cap. 8 espone feed XML. website.mode='omnia_template' →
          v1 stub inattivi, Cap. 8 gestisce brand extractor + themes
          + custom_domain."
        - "Cap. 13 Team & Ruoli: Settings NON gestisce membri.
          MembersPage separata (/app/settings/members)."
        - "Cap. 17 Domain Vault: Settings NON gestisce custom_domain.
          DomainVerifyPage separata (/app/settings/domain-verify).
          existing_domain in agency impostato in signup, non da
          Settings v1."
        - "Cap. 18 Notifiche: Settings NO toggle preferenze notifiche
          v1 (backlog A-021)."
        - "§19.10 Billing: BillingPage separata
          (/app/settings/billing). Piani Founders + crediti + Stripe."
      errori_comuni: []
      permessi:
        - "N/A · documentativo"
    screenshot: []

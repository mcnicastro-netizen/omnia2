  - id: api.cloud-secrets-vault
    titolo: Secrets Cloud Agent — vault Cursor vs .env (D-Secrets)
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, secrets, vault, cursor, cloud-agent, stripe, resend, gemini, openapi, railway, d-116, d-123, onda-c]
    correlati: [api.stripe-sandbox-cloud, api.visura-openapi-catasto, api.portale-audit-program, api.railway-api-deploy, settings.billing-pagina-separata]
    domanda_naturale: "Dove metto le API key su Cloud Agent? Perché l'agent non vede Stripe anche se le ho salvate?"
    contenuto:
      a_cosa_serve: >
        I secret Cursor (Environment Secrets su omnia2) sono una COPIA
        di iniezione. SoT = password manager + console provider
        (INTEGRITY_AND_SECRETS.md · CLOUD_SECRETS_INVENTORY.md).
        Nomi env var esatti. Scope Environment preferito; evitare doppioni
        Personal+Environment (live+test insieme). Boot auto (8 Ott 2026):
        materialize vault→.env (+OPENAPI_*), sync FRONTEND_* dal tunnel,
        sync webhook Stripe test sul trycloudflare. Env id omnia2:
        b80b635c-b592-11f1-bb68-864e54d14197. In chat desktop il pannello
        Add secrets spesso apre solo Personal o non appare — usare
        Secrets UI Environment.
      quando_si_usa: >
        Agent dice secret missing/live; New Project vault vuoto;
        billing 503; mail in [EMAIL MOCK]; dopo Save Secrets UI;
        deploy Railway/Vercel.
      passi:
        - "Avvia sempre agent su github.com/mcnicastro-netizen/omnia2
          (mai New Project / Origin-tmp)."
        - "Secrets UI Environment: RESEND_API_KEY, GEMINI_API_KEY, FAL_KEY,
          STRIPE_SECRET_KEY=sk_test_…, STRIPE_PUBLISHABLE_KEY=pk_test_…,
          STRIPE_ENABLED=true, STRIPE_WEBHOOK_SECRET=whsec_…,
          OPENAPI_ENABLED / OPENAPI_EMAIL / OPENAPI_API_KEY (Visura se Catasto attivo)."
        - "Go-live: RAILWAY_TOKEN, RAILWAY_PROJECT_ID,
          OMNIA_API_PUBLIC_URL=`OMNIA_API_PUBLIC_URL`,
          VERCEL_TOKEN/ORG/PROJECT_ID — vedi api.railway-api-deploy /
          api.vercel-fe-deploy."
        - "STRIPE_MODE non obbligatorio in vault: con sk_test_ lo stack
          imposta mode=test da solo."
        - "Dopo Save: apri agent NUOVO — le chat vecchie tengono l'inject
          del loro boot (anche se in UI Secrets vedi i nomi nuovi)."
        - "Verifica: bash scripts/check-secrets-presence.sh
          (class sk_test/sk_live · WARN vault missing · FRONTEND tunnel)."
        - "Boot: stripe-vault-materialize.py + sync-public-base-url.py +
          sync-stripe-webhook-url.py da cloud-agent-start / omnia-stack."
      errori_comuni:
        - problema: "In UI vedo le chiavi ma l'agent dice sk_live o absent"
          soluzione: >
            Controlla doppioni Personal vs Environment; class reale =
            check-secrets sul process. Chat già aperte non rileggono
            vault. Con sk_live_ + STRIPE_ENABLED=true il billing punta a
            produzione — su Cloud sostituisci con sk_test_/pk_test_.
        - problema: "Ho salvato i 12 secret ma questa chat non li vede"
          soluzione: >
            Normale. Chiudi e apri nuova chat/agent sullo stesso env omnia2.
        - problema: "Ho messo Chiave pubblicabile come nome secret"
          soluzione: >
            Nome invalido. Usa STRIPE_PUBLISHABLE_KEY / STRIPE_SECRET_KEY.
        - problema: "Il pannello Add secrets a destra mostra solo Personal"
          soluzione: >
            Bug/limitazione Cursor in chat desktop. Ignora quel pannello;
            salva in Environments → omnia2 → Secrets → Environment.
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.railway-security-rotation
    titolo: Rotazione credenziali dopo disclosure Railway (22-Ott-2026)
    modulo: Codice API

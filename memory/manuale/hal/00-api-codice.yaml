  - id: api.vercel-fe-deploy
    titolo: Deploy FE OMNIA su Vercel (D-074)
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, vercel, deploy, frontend, d-074, dns, cloudflare, cra]
    correlati: [api.railway-api-deploy, api.cloud-secrets-vault, api.stripe-sandbox-cloud]
    domanda_naturale: "Dov'è il frontend di produzione? Come si fa il deploy su Vercel?"
    contenuto:
      a_cosa_serve: >
        Frontend produzione = Vercel (CRA in frontend/). Go-live 12-Ott-2026:
        progetto omnia-frontend (`VERCEL_PROJECT_ID` (vault)),
        alias https://omnia-frontend-kappa.vercel.app. Domini custom
        omniarealestateecosystem.it / www / app / cloud. Build usa
        REACT_APP_BACKEND_URL=`OMNIA_API_PUBLIC_URL`.
        vercel.json: CI=false yarn build (evita fail ESLint warnings in CI).
      quando_si_usa: >
        Redeploy FE; aggiungere domini; allineare DNS Cloudflare;
        verificare login demo su apex/app.
      passi:
        - "Vault: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID,
          OMNIA_API_PUBLIC_URL=`OMNIA_API_PUBLIC_URL`."
        - "bash scripts/vercel-prep-check.sh && bash scripts/vercel-deploy.sh."
        - "DNS CF: apex A 216.198.79.1 / 64.29.17.1; www/app/cloud CNAME
          cname.vercel-dns.com. Non toccare api (Railway) né MX Resend."
        - "SSL Cloudflare Full; se 525 su apex/www prova DNS only (nuvola grigia)."
        - "Smoke: https://www…/ https://app…/it/login → 200."
      errori_comuni:
        - problema: "Deploy Vercel fallisce per eslint react-hooks"
          soluzione: >
            CI=true tratta warning come errori. vercel.json deve avere
            buildCommand CI=false yarn build (già in repo).
        - problema: "VERCEL_ORG_ID senza VERCEL_PROJECT_ID → errore CLI"
          soluzione: >
            Creare/link progetto omnia-frontend e salvare VERCEL_PROJECT_ID
            in vault Environment.
        - problema: "apex/www 525 Cloudflare"
          soluzione: >
            SSL Full + origin Vercel; spesso serve DNS only (grigio) su
            apex/www mentre app/cloud già DNS only funzionano.
        - problema: "OMNIA_API_PUBLIC_URL in vault include KEY="
          soluzione: >
            Risalvare solo `OMNIA_API_PUBLIC_URL`
            (scripts/vercel-deploy.sh ora strippa il prefisso).
        - problema: "Academy → Cerca casa crash / API undefined (D-133)"
          soluzione: >
            Build Vercel senza REACT_APP_BACKEND_URL. Redeploy con
            vercel-deploy.sh che bake OMNIA_API_PUBLIC_URL. Non
            blankare BACKEND_URL in package.json build script.

    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, cloud-agent, builds, snapshot, bld, cursor, environment]
    correlati: [api.cloud-secrets-vault, api.portale-audit-program]
    domanda_naturale: "A destra della chat vedo bld-20261007-… devo salvarlo? Cos'è un environment build?"
    contenuto:
      a_cosa_serve: >
        Un ID `bld-YYYYMMDD-…` è uno snapshot di environment Cloud Agent
        (install già eseguito sul default branch). Cursor lo crea in
        automatico (RECURRING / CONFIG_CHANGE) o on-demand. Non è una
        password né un secret: è un riferimento operativo allo snapshot.
      quando_si_usa: >
        Founder vede un bld a destra in chat; vuole capire se annotarlo;
        debug “agent lento / install fallito”; pin di un build sano.
      passi:
        - "Non serve salvarlo come secret (non va in password manager)."
        - "Cursor tiene lo storico in Dashboard → Environments → Builds."
        - "Utile annotarlo solo se vuoi: (a) ripartire da QUELLO snapshot,
          (b) confrontare un build SUCCEEDED vs FAILED, (c) ticket supporto."
        - "La chat corrente può essere su un bld diverso dal più recente
          SUCCEEDED (es. boot da build precedente) — normale."
        - "Secret (Stripe/Resend/…) restano nel vault Environment; il bld
          non li sostituisce."
      errori_comuni:
        - problema: "Ho salvato il bld nel password manager"
          soluzione: >
            Non necessario. Tieni lì solo API key. Il bld è già in Dashboard.
        - problema: "Build SUCCEEDED ma l'agent non ha Mongo/Stripe"
          soluzione: >
            start/secrets sono per-boot; verifica cloud-agent-start + vault,
            non solo lo snapshot install.
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.visura-openapi-catasto
    titolo: Visura B2C e OpenAPI.it Catasto — D-116 single-key
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, visura, openapi, catasto, b2c, provider, dogfood, d-118, d-116]
    correlati: [api.cloud-secrets-vault, api.portale-audit-program, api.stripe-sandbox-cloud, api.founder-ops-portale]
    domanda_naturale: "Come attivo Visura con una sola API key? Serve OPENAPI_EMAIL?"
    contenuto:
      a_cosa_serve: >
        Visura B2C (€4,90, SKU b2c_visura_catastale) via OpenAPI.it Catasto
        (shared/openapi_catasto.py · visura_b2c.py). D-116: in sandbox basta
        OPENAPI_ENABLED=true + OPENAPI_API_KEY; email OAuth = OPENAPI_EMAIL
        oppure fallback ADMIN_EMAIL / OMNIA_ADMIN_EMAIL (auth_mode=oauth_single_key).
        Host default test.catasto.openapi.it / test.oauth.openapi.com finché
        OPENAPI_MODE≠live. Fail post-pagamento → ops_alert kind=openapi_visura.
      quando_si_usa: >
        Dogfood Visura; catalog openapi_enabled=false; Onda D provider;
        manca OPENAPI_EMAIL in vault.
      passi:
        - "Vault minimo sandbox: OPENAPI_ENABLED=true + OPENAPI_API_KEY
          (console Sandbox). ADMIN_EMAIL già in .env = fallback OAuth."
        - "GET /api/cloud/visura/catalog → openapi_enabled=true."
        - "Smoke: ping + create + PDF sandbox (byte %PDF)."
        - "Se create fallisce dopo Stripe paid: Allarmi Ops (openapi_visura)."
        - "Produzione: OPENAPI_MODE=live + credenziali/host prod — non auto."
      errori_comuni:
        - problema: "openapi_enabled=false con solo OPENAPI_API_KEY"
          soluzione: >
            Serve D-116 in codice (merge) e ADMIN_EMAIL risolvibile, oppure
            OPENAPI_EMAIL / OPENAPI_TOKEN espliciti.
        - problema: "Ho la key ma Catasto provider sospeso"
          soluzione: >
            Gap provider. SKIP dogfood Visura; non bloccare Stripe test.
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.founder-ops-portale
    titolo: Founder Ops — costi, portale, alert, backup (super_admin)
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, ops, founder, b2c, telemetry, backup, alert, p-025, p-027, d-118]
    correlati: [api.portale-audit-program, api.stripe-sandbox-cloud, api.visura-openapi-catasto, settings.billing-pagina-separata]
    domanda_naturale: "Cosa vedo in /app/ops? Perché gli incassi B2C erano a zero?"
    contenuto:
      a_cosa_serve: >
        Cruscotto Founder (solo super_admin): GET /api/app/ops/overview
        (costi AI, wallet, B2C revenue, alert, backup, scheduler, portal.*).
        Legal volume: /app/ops/legal. Moderazione UGC: /app/moderation.
        P-025: b2c_purchases.amount_eur da Stripe amount_total/100 (o catalogo).
        P-027: portal = registrazioni, mutui, inquiry UGC, digest runs, visura,
        UGC pending, invoices count. P-028: POST /ops/alerts/{id}/ack e ack-all.
        P-029: POST /ops/backup/run. Nav Shell: Ops Costi / Ops Legal / Moderazione.
      quando_si_usa: >
        Controllare incassi B2C; allarmi Stripe/LLM/Visura; backup MISSING;
        coda annunci privati; post-audit D-118 (fascicolo + finding aperti).
      passi:
        - "UI: /it/app/ops · API GET /api/app/ops/overview?days=7|30|90."
        - "Card Portale: contatori periodo · link Moderazione / Ops Legal."
        - "Allarmi: Visto / Segna tutti visti (ack)."
        - "Backup ≠ OK → Esegui ora (POST /ops/backup/run)."
        - "Nota P-046: backup_job ancora senza molte collection B2C (coda «vai»)."
        - "A-038 fatture/dati fiscali = post-test, non in questo cruscotto."
        - "Stato audit: docs/audit/OMNIA_PORTALE_AUDIT_FASCICOLO.md."
      errori_comuni:
        - problema: "b2c_revenue_eur=0 con acquisti paid"
          soluzione: >
            Pre-fix: amount_eur assente (P-025). Post-fix: webhook scrive
            importo; overview fa backfill da catalogo sui legacy.
        - problema: "Backup MISSING su Cloud"
          soluzione: >
            Premi Esegui ora o attendi cron 03:15 UTC. Path BACKUP_ROOT
            (default backend/.backups, gitignored).
        - problema: "Restore senza pagamenti/consensi B2C"
          soluzione: >
            Gap P-046/P-047: estendere _COLLECTIONS + RESTORE_MANUAL (solo «vai»).
      permessi:
        - super_admin / Founder
      screenshot: []


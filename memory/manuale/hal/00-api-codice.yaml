            valore e Salva; poi apri un nuovo agent.
        - problema: "YouTrust non permette nuova API key dopo revoke"
          soluzione: >
            Ticket supporto inviato. Finché no key: ESIGN_PROVIDER=mock.
        - problema: "Ho mandato uno screenshot delle Variables con valori"

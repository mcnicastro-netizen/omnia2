    livello: avanzato
    tags: [codice, railway, security, rotazione, secrets, stripe, jwt, p0]
    correlati: [api.railway-api-deploy, api.cloud-secrets-vault, api.stripe-sandbox-cloud]
    domanda_naturale: "Railway ha segnalato un leak delle Variables. Cosa dobbiamo ruotare?"
    contenuto:
      a_cosa_serve: >
        Incident Railway 22-Ott-2026: possibile accesso a env Variables.
        Progetto omnia-api va trattato come esposto. Runbook
        docs/ops/RAILWAY_SECURITY_ROTATION_2026-10-22.md.
      quando_si_usa: >
        Dopo mail disclosure Railway; prima di feature; dopo Save vault
        (nuovo agent); se Founder chiede stato rotazione.
      passi:
        - "Revoca/crea key presso provider (Stripe, Gemini, fal, Resend,
          OpenAPI, YouTrust, JWT, RAILWAY_TOKEN) — Founder."
        - "Aggiorna Variables service omnia-api + vault Cursor Environment
          omnia2 (stessi nomi). UI Cursor non mostra i valori: sovrascrivi."
        - "Applicare/Distribuire modifiche Variables → smoke GET /api/health."
        - "Stato 22-Ott sera: CORE DONE. Residui: YouTrust ticket
          (ESIGN_PROVIDER=mock), Mongo rotate saltato, eventuale secondo
          giro se valori finiti in screenshot (mai foto secret)."
        - "Prompt nuovo agent:
          docs/ops/NEW_AGENT_PROMPT_POST_RAILWAY_ROTATION.md."

  - id: api.backup-archivio
    titolo: Backup giornaliero archivio — cosa salva e quanto costa
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, backup, storage, audit, d-073, d-085]
    correlati: [api.storage-costi, api.jobs-async, api.media-file, api.restore-disaster]
    domanda_naturale: "Come funziona il backup? Cosa viene salvato? Posso ripristinare un'agenzia?"
    contenuto:
      a_cosa_serve: >
        Audit P10 ACQUISITO: bak esiste ma ricopia tutto ogni giorno
        (~31×). Dump incompleto; può partire due volte; trash/orphan
        inclusi. Restore assente → P11. €0,04 non confermato; listino
        fermo. Orchestrazione job non decidere ancora. B-01…B-14.
      quando_si_usa: >
        Domande su backup, retention, restore, costo disco ops.
      passi:
        - "backup_job.py: JSONL whitelist + copytree local + purge >R."
        - "Costo: GB_bak ≈ X×(R+1); €/GB all-in non confermato."
        - "Restore: promessa D-085 via supporto — codice assente (P11)."
        - "Niente fix / niente listino senza design Backup+Restore."
      errori_comuni:
        - problema: "Ho lanciato il backup ma mancano le richieste clienti"
          soluzione: >
            Atteso oggi (B-02): client_requests fuori whitelist.
            Annotato in audit — non patchare senza priorità Founder.
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.restore-disaster
    titolo: Ripristino da backup — cosa manca oggi
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, restore, backup, disaster, audit, d-073, d-085, d-096]
    correlati: [api.backup-archivio, api.storage-costi, api.audit-architettura-stato]
    domanda_naturale: "Se perdiamo database e file, possiamo rimettere OMNIA come ieri?"
    contenuto:
      a_cosa_serve: >
        Audit P11 ACQUISITO + D-096 + P12: ripristino automatico = NO.
        Target = singola agenzia via supporto (bak globale → extract);
        piattaforma = emergenza interna. Bak+Restore insieme; listino
        fermo. Cestino ≠ Backup (BC-*). R-01…R-12 · BC-01…BC-05.
      quando_si_usa: >
        Domande su disaster recovery, ripristino agenzia, supporto,
        differenza cestino vs backup.
      passi:
        - "D-096: Bak→Restore→costi→eventuale listino; agency-first."
        - "Successo testabile: props+clients+requests+activities+docs+media."
        - "Cestino = delete accidentale; Backup = guaio grave (P12)."
        - "Niente fix senza «vai»; listino fermo."
      errori_comuni:
        - problema: "Il manuale dice che il supporto ripristina"
          soluzione: >
            Promessa documentata (R-02) ma oggi senza codice/tool.
            Gap acquisito in audit — non improvvisare restore in prod.
        - problema: "Ho svuotato il Cestino: è come un restore da backup?"
          soluzione: >
            No (BC-02 / D-097). Cestino = undo delete utente.
            «Elimina per sempre» = fuori area operativa; supporto può
            valutare bak valido se ancora disponibile — non garantito.
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.retention-cancellazione
    titolo: Retention — quanto sopravvive un dato dopo eliminazione
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, retention, cestino, backup, media, audit, d-073, d-097]
    correlati: [api.restore-disaster, api.backup-archivio, api.media-file]
    domanda_naturale: "Dopo Elimina per sempre, i dati spariscono davvero? Per quanto restano nel backup?"
    contenuto:
      a_cosa_serve: >
        Audit P13 (master §12) + D-097: Cestino 30gg; bak 30gg;
        media orphan senza GC; nessun offboarding agenzia.
        Finding RET-01…RET-10. Copy Cap.3/4 da riallineare a D-097.
      quando_si_usa: >
        Domande su scadenza cestino, bak, file orfani, chiusura agenzia.
      passi:
        - "D-097: Elimina per sempre ≠ irrecuperabile in assoluto."
        - "Trash può restare nel bak fino a scadenza bak."
        - "Orphan media oggi senza cleanup (D-095 ⏳)."
        - "Niente fix senza «vai»; listino fermo."
      errori_comuni:
        - problema: "Ho eliminato per sempre: è sparito ovunque?"
          soluzione: >
            Fuori dal Cestino sì. Blob e bak possono ancora avere
            copie (RET-02/RET-07) — recupero solo via supporto se bak
            valido, non garantito (D-097).
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.tenant-isolation
    titolo: Isolamento multi-tenant agenzia — stato audit
    modulo: Codice API
    widget: null
    pubblico: [super_admin, titolare]
    livello: avanzato
    tags: [codice, api, architettura, multi-tenant, agency_id, d-073, audit]
    correlati: [api.auth, api.auth-lifecycle, api.scala-10k]
    domanda_naturale: "Le agenzie sono isolate? Come funziona il multi-tenant? agency_id è sicuro?"
    contenuto:
      a_cosa_serve: >
        Spiegare onestamente lo stato dell'isolamento: isolation
        applicativa generalmente presente sul CRM; isolation end-to-end
        incompleta (media, guard non universale, backup, bypass
        super_admin/job). Fonte: audit Punto 3 · Cap. 00.
      quando_si_usa: >
        Domande su sicurezza tra agenzie, tenant, agency_id, backup
        globale, media pubblici.
      passi:
        - "Confine = Agenzia (agency_id). Su /api/app JWT + require_agency
          + filtri espliciti; tenant_guard auto-inject su TENANT_COLLECTIONS."
        - "Verdetto Founder: isolation applicativa sì in pratica;
          end-to-end no. Non dire 'multi-tenancy sicura' senza caveat."
        - "Finding acquisiti (NO fix senza vai): media pubblico su
          documenti; collezioni fuori guard; trusted paths
          super_admin/job; id senza agency_id; agency_ids[0] vs attiva;
          backup = privileged data plane."
        - "Dettaglio: memory/AUDIT_ARCHITETTURA_NOTE.md e Cap. 00
          manuale."
      errori_comuni:
        - problema: "Un agente vede dati di un'altra agenzia"
          soluzione: >
            Non dovrebbe sul CRM normale. Segnala bug. Non confondere
            con ImmoCloud/feed pubblici o azioni super_admin.
        - problema: "Il backup è per-agenzia?"
          soluzione: >
            Oggi dump giornaliero pan-tenant su disco: piano dati
            privilegiato, non isolation API.
      permessi:
        - Lettura concetto: titolare / super_admin
        - Fix: solo Founder con «vai»
      screenshot: []

  - id: api.auth-lifecycle
    titolo: Login JWT cookie MFA API key — lifecycle
    modulo: Codice API
    widget: null
    pubblico: [super_admin, titolare]
    livello: avanzato
    tags: [codice, api, auth, jwt, mfa, csrf, audit, d-073]
    correlati: [api.auth, api.tenant-isolation]
    domanda_naturale: "Come funziona il login? C'è MFA? Come funzionano le API key? Refresh token?"
    contenuto:
      a_cosa_serve: >
        Mappa AuthN/AuthZ post audit Punto 4: cookie HttpOnly access
        ~15m + refresh ~7g con jti; CSRF in prod; brute-force login;
        MFA TOTP; API key omk_live hash + crediti. Gap acquisiti senza fix.
      quando_si_usa: >
        Domande su sessione, logout, MFA, invite password, ruoli,
        API key.
      passi:
        - "AuthN: apps/core/auth.py + shared/auth/* . Ruolo effettivo
          dal DB user, non solo claim JWT."
        - "Tre piani: /api/app JWT+ruoli; /api/cloud JWT/anon; /api/v1
          Bearer API key."
        - "MFA: shared/auth/mfa.py + /api/auth/mfa/* — TOTP + backup."
        - "Finding (NO fix senza «vai»): fascicolo senza agency_ids;
          invite riscrive password → **D-100** fix-needed (utente
          esistente = link agency, mai overwrite password_hash);
          no refresh rotation; reset non revoca sessioni;
          get_current_user senza is_active; agency_ids[0] su
          invite/api_keys."
      errori_comuni:
        - problema: "Sono bloccato al login dopo troppi tentativi"
          soluzione: >
            Brute-force: max 5 tentativi, lock ~15 minuti su ip+email.
            Aspetta o reset password.
        - problema: "Ho accettato un invito e non riesco più a entrare
          con la vecchia password"
          soluzione: >
            Comportamento attuale: accept invite su email già
            registrata sovrascrive password_hash. Decisione D-100:
            non deve più farlo (fix post-«vai»).
      permessi:
        - Concetto: titolare / super_admin
      screenshot: []

  - id: api.audit-architettura-stato
    titolo: Dove siamo con l'audit architettura SaaS?
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, audit, architettura, roadmap, d-073]
    correlati: [api.tenant-isolation, api.auth-lifecycle, api.entity-lifecycle, api.jobs-async, api.storage-costi, api.backup-archivio, api.restore-disaster, api.retention-cancellazione]
    domanda_naturale: "A che punto è l'audit architettura? Cosa manca? Posso fixare i finding?"
    contenuto:
      a_cosa_serve: >
        Prompt master AUDIT_PROMPT_MASTER.md (§1–§27). Numerazione
        sessione (P1…P16). P15 acquisito + D-100/D-101; P16 Jobs
        deepen (JA-*) consegnato. D-094…D-101 dominio, codice ⏳.
        Listino fermo. Finding in note + A-035. Prossimo tipico §16
        osservabilità.
      quando_si_usa: >
        Ripresa audit, metodo, priorità, dove siamo.
      passi:
        - "Rileggi AUDIT_PROMPT_MASTER.md e la mappa sessione↔master."
        - "Progresso in AUDIT_ARCHITETTURA_NOTE.md · Cap. 00 · A-035."
        - "Un punto alla volta; no P0–P3 finché non §23; no fix senza
          «vai» implementazione (D-100 tra i primi fix)."
        - "Job automatici: D-101 single-instance ora; worker poi.
          Listino fermo finché Bak+Restore disegnati."
      errori_comuni:
        - problema: "Inizio a patchare i media pubblici subito"
          soluzione: >
            Bloccato dal metodo Founder. Annota, non shippare senza
            «vai» e priorità.
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.entity-lifecycle
    titolo: Lifecycle entità CRM — cestino, richieste, feed
    modulo: Codice API
    widget: null
    pubblico: [super_admin, titolare]
    livello: avanzato
    tags: [codice, lifecycle, cestino, richieste, feed, audit, d-073]
    correlati: [api.audit-architettura-stato, api.tenant-isolation, api.media-file]
    domanda_naturale: "Cosa succede quando metto un immobile nel cestino? Le richieste si cancellano? Escono dal feed?"
    contenuto:
      a_cosa_serve: >
        Lifecycle P5/P6: cestino Immobile/Cliente; Richieste archiviate;
        D-094 dominio. Attività = domanda aperta (non = Richieste).
        Enforcement proiezioni a macchia di leopardo (E-01…E-07).
      quando_si_usa: >
        Domande su cestino, feed, archive richieste, attività.
      passi:
        - "D-094: trashed esclude feed/sync senza forzare withdrawn;
          Cliente Trash → Richieste archiviate; restore non riapre."
        - "P6: OK ImmoCloud/v1/publishing feed; gap OSF/sync/site/social/MLS."
        - "Attività: non decidere cascade con Cliente finché non
          chiarito appartengono a chi (audit aperto)."
        - "Dettaglio in AUDIT_ARCHITETTURA_NOTE.md."
      errori_comuni:
        - problema: "Ho cestinato un annuncio ma lo vedo ancora sul feed"
          soluzione: >
            Possibile (E-01/E-02). D-094 lo vieta — fix solo post-audit
            con «vai» implementazione.
      permessi:
        - Concetto: titolare / super_admin
      screenshot: []

  - id: api.media-file
    titolo: Media e file — upload, GET pubblico, delete blob
    modulo: Codice API
    widget: null
    pubblico: [super_admin, titolare]
    livello: avanzato
    tags: [codice, media, fascicolo, storage, audit, d-073]
    correlati: [api.entity-lifecycle, api.tenant-isolation]
    domanda_naturale: "Come sono salvate le foto e i documenti del Fascicolo? Sono pubblici? Si cancellano dal disco?"
    contenuto:
      a_cosa_serve: >
        Audit P7 + D-095: distinguere media pubblici e privati; no
        UUID=secret; cleanup blob indipendente da S3/R2, idempotente.
        Oggi GET /api/media unico; delete_object senza caller.
      quando_si_usa: >
        Domande su storage, fascicolo, privacy foto, orphan blob.
      passi:
        - "D-095 dominio: foto pubblicabili OK pubblici; fascicolo/
          modulistica con AuthZ o URL firmati (meccanismo dopo)."
        - "Cluster: media-authorization = P3.1+P4.1+M-01; Mongo⟷blob
          = M-02…M-04+L-05/L-06. Codice ⏳."
        - "P8: nessun job cleanup blob (J-04); sync senza trash (J-01)."
      errori_comuni:
        - problema: "Ho eliminato un documento dal Fascicolo ma il file?"
          soluzione: >
            Oggi solo ref DB (M-03). D-095 richiede cleanup affidabile —
            non implementato finché Founder non dà «vai» post-audit.
      permessi:
        - Concetto: titolare / super_admin

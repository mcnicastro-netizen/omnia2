  - id: api.cloud-secrets-vault
    titolo: Secrets Cloud Agent — vault Cursor vs .env (D-Secrets)
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, secrets, vault, cursor, cloud-agent, stripe, resend, gemini, openapi, d-116, onda-c]
    correlati: [api.stripe-sandbox-cloud, api.visura-openapi-catasto, api.portale-audit-program, settings.billing-pagina-separata]
    domanda_naturale: "Dove metto le API key su Cloud Agent? Perché l'agent non vede Stripe anche se le ho salvate?"
    contenuto:
      a_cosa_serve: >
        I secret Cursor (Environment Secrets su omnia2) sono una COPIA
        di iniezione. SoT = password manager + console provider
        (INTEGRITY_AND_SECRETS.md · CLOUD_SECRETS_INVENTORY.md).
        Nomi env var esatti. Scope Environment preferito; evitare doppioni
        Personal+Environment (live+test insieme). Boot auto (8 Ott 2026):
        materialize vault→.env (+OPENAPI_*), sync FRONTEND_* dal tunnel,
        sync webhook Stripe test sul trycloudflare.
      quando_si_usa: >
        Agent dice secret missing/live; New Project vault vuoto;
        billing 503; mail in [EMAIL MOCK]; dopo Save Secrets UI.
      passi:
        - "Avvia sempre agent su github.com/mcnicastro-netizen/omnia2
          (mai New Project / Origin-tmp)."
        - "Secrets UI Environment: RESEND_API_KEY, GEMINI_API_KEY, FAL_KEY,
          STRIPE_SECRET_KEY=sk_test_…, STRIPE_PUBLISHABLE_KEY=pk_test_…,
          STRIPE_ENABLED=true, STRIPE_WEBHOOK_SECRET=whsec_…,
          OPENAPI_ENABLED / OPENAPI_EMAIL / OPENAPI_API_KEY (Visura se Catasto attivo)."
        - "STRIPE_MODE non obbligatorio in vault: con sk_test_ lo stack
          imposta mode=test da solo."
        - "Dopo Save: apri agent NUOVO — le chat vecchie tengono l'inject
          del loro boot (anche se in UI Secrets vedi i nomi nuovi)."
        - "Verifica: bash scripts/check-secrets-presence.sh
          (class sk_test/sk_live · WARN vault missing · FRONTEND tunnel)."
        - "Boot: stripe-vault-materialize.py + sync-public-base-url.py +
          sync-stripe-webhook-url.py da cloud-agent-start / omnia-stack."
      errori_comuni:
        - problema: "In UI vedo le chiavi ma l'agent dice sk_live o absent"
          soluzione: >
            Controlla doppioni Personal vs Environment; class reale =
            check-secrets sul process. Chat già aperte non rileggono
            vault. Con sk_live_ + STRIPE_ENABLED=true il billing punta a
            produzione — su Cloud sostituisci con sk_test_/pk_test_.
        - problema: "Ho salvato i 12 secret ma questa chat non li vede"
          soluzione: >
            Normale. Chiudi e apri nuova chat/agent sullo stesso env omnia2.
        - problema: "Ho messo Chiave pubblicabile come nome secret"
          soluzione: >
            Nome invalido. Usa STRIPE_PUBLISHABLE_KEY / STRIPE_SECRET_KEY.
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.stripe-sandbox-cloud
    titolo: Stripe sandbox su Cloud Agent — attivazione test
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, stripe, sandbox, billing, sk-test, setup-stripe, cloud-agent]
    correlati: [api.cloud-secrets-vault, settings.billing-pagina-separata]
    domanda_naturale: "Come attivo Stripe sandbox su OMNIA Cloud? Perché billing resta disabilitato?"
    contenuto:
      a_cosa_serve: >
        Sandbox = chiavi sk_test_ / pk_test_ + STRIPE_ENABLED=true.
        Catalogo piani/crediti via python -m apps.billing.setup_stripe
        (idempotente, lookup_key). One-shot:
        bash scripts/activate-stripe-sandbox.sh
        (materialize + setup + restart stack + GET /billing/plans).
        sk_live_ non auto-abilita (anti-soldi-veri).
      quando_si_usa: >
        Dogfood billing, checkout piani Founders, crediti, B2C Stripe.
      passi:
        - "Vault: STRIPE_SECRET_KEY=sk_test_… STRIPE_PUBLISHABLE_KEY=pk_test_…
          STRIPE_ENABLED=true (scope Environment su omnia2)."
        - "bash scripts/check-secrets-presence.sh → class=sk_test / pk_test."
        - "bash scripts/activate-stripe-sandbox.sh → exit 0 e
          GET /api/billing/plans enabled=true mode=test."
        - "Se API già up senza Stripe: riavvia listener :43121 poi
          omnia-stack ensure (adopt non ricarica .env da solo)."
        - "Verifica UI: /it/app/settings/billing."
      errori_comuni:
        - problema: "activate exit 2 class sk_live / check-secrets class=sk_live"
          soluzione: >
            Vault ha sk_live_/pk_live_. Su Cloud sostituisci con Test keys
            (Stripe Dashboard → Test mode). Non riusare chat partite con
            live. STRIPE_MODE non serve in vault: deriva da sk_test_.
        - problema: "setup_stripe ok ma /billing/plans enabled=false"
          soluzione: >
            Processo uvicorn vecchio. Riavvia API dopo materialize.
        - problema: "HTTP 503 Billing in preparazione"
          soluzione: >
            STRIPE_ENABLED!=true o secret key assente nel process
            (non solo nel file .env commentato).
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.cloud-environment-builds
    titolo: Build Cloud Agent (bld-…) — cosa sono e se salvarli
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, cloud-agent, builds, snapshot, bld, cursor, environment]
    correlati: [api.cloud-secrets-vault, api.portale-audit-program]
    domanda_naturale: "A destra della chat vedo bld-20261007-… devo salvarlo? Cos'è un environment build?"
    contenuto:
      a_cosa_serve: >
        Un ID `bld-YYYYMMDD-…` è uno snapshot di environment Cloud Agent
        (install già eseguito sul default branch). Cursor lo crea in
        automatico (RECURRING / CONFIG_CHANGE) o on-demand. Non è una
        password né un secret: è un riferimento operativo allo snapshot.
      quando_si_usa: >
        Founder vede un bld a destra in chat; vuole capire se annotarlo;
        debug “agent lento / install fallito”; pin di un build sano.
      passi:
        - "Non serve salvarlo come secret (non va in password manager)."
        - "Cursor tiene lo storico in Dashboard → Environments → Builds."
        - "Utile annotarlo solo se vuoi: (a) ripartire da QUELLO snapshot,
          (b) confrontare un build SUCCEEDED vs FAILED, (c) ticket supporto."
        - "La chat corrente può essere su un bld diverso dal più recente
          SUCCEEDED (es. boot da build precedente) — normale."
        - "Secret (Stripe/Resend/…) restano nel vault Environment; il bld
          non li sostituisce."
      errori_comuni:
        - problema: "Ho salvato il bld nel password manager"
          soluzione: >
            Non necessario. Tieni lì solo API key. Il bld è già in Dashboard.
        - problema: "Build SUCCEEDED ma l'agent non ha Mongo/Stripe"
          soluzione: >
            start/secrets sono per-boot; verifica cloud-agent-start + vault,
            non solo lo snapshot install.
      permessi:
        - super_admin / Founder
      screenshot: []

  - id: api.visura-openapi-catasto
    titolo: Visura B2C e OpenAPI.it Catasto — D-116 single-key
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, visura, openapi, catasto, b2c, provider, dogfood, d-118, d-116]
    correlati: [api.cloud-secrets-vault, api.portale-audit-program, api.stripe-sandbox-cloud, api.founder-ops-portale]
    domanda_naturale: "Come attivo Visura con una sola API key? Serve OPENAPI_EMAIL?"
    contenuto:
      a_cosa_serve: >
        Visura B2C (€4,90, SKU b2c_visura_catastale) via OpenAPI.it Catasto
        (shared/openapi_catasto.py · visura_b2c.py). D-116: in sandbox basta
        OPENAPI_ENABLED=true + OPENAPI_API_KEY; email OAuth = OPENAPI_EMAIL
        oppure fallback ADMIN_EMAIL / OMNIA_ADMIN_EMAIL (auth_mode=oauth_single_key).
        Host default test.catasto.openapi.it / test.oauth.openapi.com finché
        OPENAPI_MODE≠live. Fail post-pagamento → ops_alert kind=openapi_visura.
      quando_si_usa: >

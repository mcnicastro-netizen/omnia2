  - id: api.stripe-sandbox-cloud
    titolo: Stripe sandbox su Cloud Agent — attivazione test
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, stripe, sandbox, billing, sk-test, setup-stripe, cloud-agent, webhook, railway]
    correlati: [api.cloud-secrets-vault, api.railway-api-deploy, settings.billing-pagina-separata]
    domanda_naturale: "Come attivo Stripe sandbox su OMNIA Cloud? Perché billing resta disabilitato?"
    contenuto:
      a_cosa_serve: >
        Sandbox = chiavi sk_test_ / pk_test_ + STRIPE_ENABLED=true.
        Catalogo piani/crediti via python -m apps.billing.setup_stripe
        (idempotente, lookup_key). One-shot:
        bash scripts/activate-stripe-sandbox.sh
        (materialize + setup + restart stack + GET /billing/plans).
        sk_live_ non auto-abilita (anti-soldi-veri). Webhook Test:
        destinazione stabile su api.omniarealestateecosystem.it
        (/api/billing/webhook, go-live 12-Ott-2026) e opzionale tunnel
        Cloud con descrizione OMNIA Cloud Agent portal (auto-sync).
      quando_si_usa: >
        Dogfood billing, checkout piani Founders, crediti, B2C Stripe;
        sistemare webhook dopo mail Stripe 404 Emergent.
      passi:
        - "Vault: STRIPE_SECRET_KEY=sk_test_… STRIPE_PUBLISHABLE_KEY=pk_test_…
          STRIPE_ENABLED=true (scope Environment su omnia2)."
        - "bash scripts/check-secrets-presence.sh → class=sk_test / pk_test."
        - "bash scripts/activate-stripe-sandbox.sh → exit 0 e
          GET /api/billing/plans enabled=true mode=test."
        - "Webhook Railway: Stripe Test → descrizione
          OMNIA Railway API (sandbox) →
          `OMNIA_API_PUBLIC_URL` + `/api/billing/webhook`
          · whsec su Variables Railway STRIPE_WEBHOOK_SECRET."
        - "Verifica: stripe trigger checkout.session.completed → consegna 200."
        - "Tunnel Cloud: sync-stripe-webhook-url aggiorna solo destinazioni
          con descrizione auto-sync (non toccare omnia-railway-api)."
        - "Verifica UI: /it/app/settings/billing."
      errori_comuni:
        - problema: "activate exit 2 class sk_live / check-secrets class=sk_live"
          soluzione: >
            Vault ha sk_live_/pk_live_. Su Cloud sostituisci con Test keys
            (Stripe Dashboard → Test mode). Non riusare chat partite con
            live. STRIPE_MODE non serve in vault: deriva da sk_test_.
        - problema: "setup_stripe ok ma /billing/plans enabled=false"
          soluzione: >
            Processo uvicorn vecchio. Riavvia API dopo materialize.
        - problema: "HTTP 503 Billing in preparazione"
          soluzione: >
            STRIPE_ENABLED!=true o secret key assente nel process
            (non solo nel file .env commentato).
        - problema: "Webhook invalid_signature / 400 su Railway"
          soluzione: >
            whsec della destinazione omnia-railway-api deve essere
            uguale a STRIPE_WEBHOOK_SECRET sulle Variables del service
            omnia-api (redeploy dopo cambio).
        - problema: "Lo sync Cloud ha riscritto l'URL Railway sul tunnel"
          soluzione: >
            Descrizione destinazione Railway deve essere
            OMNIA Railway API (sandbox), non …auto-sync.
      permessi:
        - super_admin / Founder
      screenshot: []


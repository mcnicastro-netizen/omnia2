  - id: api.railway-api-deploy
    titolo: Deploy API OMNIA su Railway (D-123)
    modulo: Codice API
    widget: null
    pubblico: [super_admin]
    livello: avanzato
    tags: [codice, railway, deploy, api, d-123, mongo, health, vercel, dns, stripe, webhook]
    correlati: [api.cloud-secrets-vault, api.cloud-environment-builds, api.stripe-sandbox-cloud, api.vercel-fe-deploy, api.railway-security-rotation]
    domanda_naturale: "Dov'è l'API di produzione? Come si fa il deploy su Railway?"
    contenuto:
      a_cosa_serve: >
        Host API produzione = Railway (Hetzner bloccato). Repo:
        railway.toml + Dockerfile.railway + scripts/railway-deploy.sh.
        Go-live 12-Ott-2026: API pubblica
        `OMNIA_API_PUBLIC_URL`. Alias
        https://omnia-api-production-2cec.up.railway.app.
        GET /api/health → status=ok db=ok. Stripe Test su api./billing/webhook.
        FE Vercel: api.vercel-fe-deploy.
      quando_si_usa: >
        Redeploy API; salvare OMNIA_API_PUBLIC_URL; webhook Stripe;
        go-live Vercel; health check produzione.
      passi:
        - "Vault Environment: RAILWAY_TOKEN (Account token fresco),
          RAILWAY_PROJECT_ID=`RAILWAY_PROJECT_ID` (vault),
          OMNIA_API_PUBLIC_URL=`OMNIA_API_PUBLIC_URL`."
        - "Revoca token Railway esposti in chat prima di salvarne uno nuovo."
        - "bash scripts/railway-prep-check.sh && bash scripts/railway-deploy.sh
          (rimappa RAILWAY_TOKEN→RAILWAY_API_TOKEN, pin Dockerfile.railway)."
        - "Smoke: curl -sS $OMNIA_API_PUBLIC_URL/api/health."
        - "Stripe Test: destinazione omnia-railway-api (descrizione
          OMNIA Railway API (sandbox)) + STRIPE_WEBHOOK_SECRET su
          Variables Railway; stripe trigger checkout.session.completed."
        - "DNS api: già live (DNS_SETUP_GUIDE §4c)."
        - "FE: api.vercel-fe-deploy (D-074)."
      errori_comuni:
        - problema: "railway whoami → Unauthorized con token Account in vault"
          soluzione: >
            Se RAILWAY_TOKEN resta nel process env, la CLI lo tratta come
            project token. Lo script unsetta RAILWAY_TOKEN ed esporta
            RAILWAY_API_TOKEN. Non mettere il token Account anche come
            RAILWAY_API_TOKEN nel vault (nome canonico = RAILWAY_TOKEN).
        - problema: "Build usa Dockerfile Cloud Agent invece di Dockerfile.railway"
          soluzione: >
            Pin dockerfilePath=Dockerfile.railway via GraphQL
            serviceInstanceUpdate (Builder enum senza DOCKERFILE).
        - problema: "Add secrets in chat non appare / solo Personal"
          soluzione: >
            Usare Secrets UI Environment omnia2. Nuovo agent dopo Save.
        - problema: "Stripe mail 404 su emergentagent.com/api/stripe/webhook"
          soluzione: >
            Endpoint Emergent obsoleto. Usare Railway /api/billing/webhook
            (omnia-railway-api). Non ricreare path /api/stripe/webhook.

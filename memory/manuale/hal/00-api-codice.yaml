    domanda_naturale: "Come funziona il backup? Cosa viene salvato? Posso ripristinare un'agenzia?"
    contenuto:
      a_cosa_serve: >
        Audit P10 + P17 Osservabilità: bak esiste ma ricopia tutto
        (~31×). Esito solo in MANIFEST.json + log (O-01); tick
        swallowa errori (O-02); no last_run (O-05). Restore assente
        (D-096). Listino fermo. B-* · O-01…O-05.
      quando_si_usa: >
        Domande su backup, retention, restore, costo disco ops,
        “il bak di ieri è andato a buon fine?”.
      passi:
        - "backup_job.py: JSONL whitelist + copytree local + purge >R."
        - "Osservabilità: nessuno stato Mongo/API/alert su esito bak
          (O-01) — Founder Ops non mostra bak health (O-13)."
        - "Restore: promessa D-085 via supporto — codice assente (D-096)."
        - "Niente fix / niente listino senza design Backup+Restore."
      errori_comuni:
        - problema: "Ho lanciato il backup ma mancano le richieste clienti"
          soluzione: >
            Atteso oggi (B-02): client_requests fuori whitelist.
            Annotato in audit — non patchare senza priorità Founder.
        - problema: "Come so se il backup notturno è riuscito?"

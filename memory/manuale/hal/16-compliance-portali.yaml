  - id: compliance.correggere-da-modale
    titolo: Come si legge e usa la modale compliance
    modulo: Compliance Portali
    widget: null
    pubblico: [titolare, agente, super_admin]
    livello: base
    tags: [compliance, modale, ui, publishing-page, portal-compliance-modal, immobili-bloccati, metrics]
    correlati: [compliance.feed-vs-sync, compliance.mapping-campi-immobile]
    domanda_naturale: "Come apro e leggo la modale compliance in UI?"
    contenuto:
      a_cosa_serve: >
        Vedere colpo d'occhio quanti immobili sono bloccati, quali
        sono i motivi piu' frequenti, e chi sono i primi 20 bloccati.
      quando_si_usa: >
        Prima di attivare un portale nuovo; dopo un import massivo;
        durante audit qualita' del portafoglio.
      passi:
        - "Vai in Publishing (sidebar > Portali & Publishing)."
        - "Trova la card del portale attivo (Subito, Bakeca, etc.)."
        - "Clic 'Vedi compliance' (data-testid=portal-compliance-
          {portal_slug})."
        - "La modale mostra:
          - Header con nome portale + close button
          - 4 box metriche (Totale, Pubblicabili, Bloccati, Con warning)
          - Elenco top-5 motivi HARD con conteggio (tradotti in
            italiano via REASON_LABELS)
          - Elenco primi 20 immobili bloccati con titolo + motivi
            separati da ' · '."
        - "Cosa MANCA nella modale v1 (D-051): bottone 'Correggi
          tutto' - non esiste. Link diretto 'Vai alla scheda
          immobile' dalla riga bloccata - non c'e'. Export CSV -
          non c'e'. Filtro per tipo violazione - non c'e'."
        - "Workflow correzione manuale: copia titolo immobile ->
          vai in Immobili -> cerca -> apri scheda -> correggi ->
          riapri modale per verifica."
      errori_comuni:
        - problema: "La modale non si apre"
          soluzione: >
            Controlla che il portale sia attivo (status='active').
            Endpoint /compliance funziona solo su portali collegati.
      permessi:
        - agency_admin, super_admin, branch_admin, group_admin
    screenshot: ["[SCREEN: compliance-modale-hard]"]

  - id: compliance.limitazioni-v1
    titolo: Limiti v1 del Compliance Validator (D-051 onesto)
    modulo: Compliance Portali
    widget: null
    pubblico: [titolare, agente, super_admin]
    livello: intermedio
    tags: [compliance, limiti, cosa-non-fa, ghost-label, sync-log, api-push, simulated, missing-rent, correggi, hardcoded, audit-trail, d-051]
    correlati: [compliance.panoramica-validatore, compliance.affitto-vs-vendita]
    domanda_naturale: "Cosa NON fa il Compliance Validator in v1?"
    contenuto:
      a_cosa_serve: >
        Aspettative chiare su cosa il modulo NON copre.
      quando_si_usa: >
        Prima di aspettarsi funzionalita' non implementate.
      passi:
        - "NO pagina UI dedicata: compliance e' inline in
          PublishingPage.jsx come modale. Nessuna /it/app/compliance."
        - "api_push = simulated_push v1: portali M2.6c/d wizard
          restituiscono action_status='simulated_push', nessuna
          vera chiamata al portale. Compliance filter comunque
          attivo."
        - "NO sync-log UI dedicata: sync_log collection esiste ma
          nessun pannello UI. Solo API e super_admin DB."
        - "Ghost label missing_rent in UI: REASON_LABELS.missing_rent
          esiste ma il backend non emette mai missing_rent (usa
          sempre missing_price anche per affitti). Vedrai 'Prezzo
          mancante' per affitti senza canone."
        - "NO bottone 'Sospendi sync' in UI: endpoint PATCH
          /connections/{id} esiste (status -> paused) ma nessun
          bottone frontend. Solo 'Attiva sync' e 'Disconnetti'."
        - "Legacy PORTAL_CATALOG vs CATALOG_SEED in publishing.py:
          convivenza M2.6a/M2.6d. Idealista NON in v1 (Cap. 6)."
        - "NO trend storico: validatore stateless, no dashboard
          'andamento compliance'."
        - "NO promemoria APE in scadenza: se metti EXEMPT_IN_PROGRESS
          non c'e' notifica quando aggiornare."
        - "NO bottone Correggi dalla modale: nessun deep-link alla
          scheda immobile."
        - "Soglie hardcoded (MIN_PHOTOS=3, MIN_TITLE_CHARS=10,
          MIN_DESCRIPTION_CHARS=50): non configurabili per agenzia."
        - "NO controllo semantico: 'aaaaaaaaaa' passa il SOFT
          title. Nessuna valutazione qualita' testo."
        - "NO audit trail correzioni: nessun log 'utente X ha
          risolto Y violazioni per immobile Z'."
      errori_comuni:
        - problema: "Voglio aumentare MIN_PHOTOS a 5 per la mia agenzia"
          soluzione: >
            Non disponibile v1. Le soglie sono hardcoded. Segnala
            al team OMNIA se e' priorita' per te.
      permessi:
        - Info descrittiva
    screenshot: []

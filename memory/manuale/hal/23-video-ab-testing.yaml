  - id: video.kenburns
    titolo: Esiste Ken Burns? Dove lo genero su ImmobilCloud?
    modulo: Video & Analytics
    widget: null
    pubblico: [titolare, agente, segreteria, b2c_client]
    livello: base
    tags: [501, limiti, video, cap23, ken-burns, b2c, kling, d-064, d-140, a-026, vendi]
    correlati: [video.cos-e, video.crediti, video.limitazioni-v1, notifiche.sell-flusso-moderazione]
    domanda_naturale: >
      Esiste Ken Burns? Perché in agenzia dà 501? Dove genero il video
      tour da privato? Come miglioro la definizione?
    contenuto:
      a_cosa_serve: >
        Split D-064 + UX D-140: Ken Burns ffmpeg gratis SOLO B2C.
        SoT generazione = Vendi dopo le foto (owner kenburns anche
        bozza). Gestionale agenzia → 501, usa Kling Pro a crediti.
      quando_si_usa: >
        Privato in Vendi dopo upload foto; oppure play su scheda
        pubblica se già ready. Agente CRM → Kling.
      passi:
        - "B2C Vendi: salva annuncio con foto → Genera video 15s
          (POST /api/cloud/me/properties/{pid}/kenburns)."
        - "Scheda pubblica: play se ready; genera residuale solo lister."
        - "Qualità D-140: 1080p CRF18, foto HD preferite; ffmpeg in Railway."
        - "Agenzia: POST /api/app/videos/kling/property/{pid}. Ken Burns app → 501."
      errori_comuni:
        - problema: "kenburns_disabled_in_agency / 501"
          soluzione: >
            Atteso. Usa Kling a crediti oppure genera da Vendi B2C.
        - problema: "Video fallisce / no_photos_downloaded"
          soluzione: >
            Salva foto su listing; media via Object Storage; verifica
            ffmpeg sul container Railway.
        - problema: "402 crediti insufficienti su Kling"
          soluzione: "Ricarica crediti / verifica piano (Cap. 19)."
      permessi:
        - "Kling: utenti agenzia autenticati con crediti"
        - "Ken Burns cloud: owner B2C (Vendi) + pubblico live"
    screenshot: []

  - id: video.crediti
    titolo: Quanto costa un video Kling / micro-tour?
    modulo: Video & Analytics
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [crediti, costi, video, cap23, kling, d-147]
    correlati: [video.cos-e, video.limitazioni-v1]
    domanda_naturale: >
      Quanto costa un video Kling nel gestionale? Quanti crediti
      per il micro-tour? È ancora 10 crediti?
    contenuto:
      a_cosa_serve: >
        Prezzo corrente micro-tour Kling Pro (solo gestionale):
        **30 crediti = €1,50** (D-147, SoT CREDIT_COSTS.micro_tour_render).
        Non è più 10 crediti (vecchio D-066, sotto COGS → perdita).
        Ken Burns sul portale B2C resta gratis.
      quando_si_usa: >
        Domande su costo video, crediti Kling, listino micro-tour,
        errore 402 insufficient_credits.
      passi:
        - "Gestionale: POST /api/app/videos/kling/property/{pid} addebita 30 cr."
        - "Se 402: ricarica crediti / verifica piano (Cap. 19)."
        - "B2C Vendi: Ken Burns gratuito — nessun credito."
        - "Listino: PRICING_OMNIA v3.2 · plans.CREDIT_COSTS."
      errori_comuni:
        - problema: "Qualcuno dice ancora 10 crediti / €3"
          soluzione: >
            Obsoleto (D-066). Dal 05-Nov-2026 / merge D-147 il costo
            è 30 crediti (€1,50). Aggiorna materiali e UI se mostrano 10.
        - problema: "402 crediti insufficienti su Kling"
          soluzione: "Servono 30 crediti disponibili sul wallet agenzia."
      permessi:
        - "Kling: utenti agenzia autenticati con crediti"
      screenshot: []


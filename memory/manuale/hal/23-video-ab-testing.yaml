  - id: video.kenburns
    titolo: Esiste Ken Burns? Funziona in agenzia?
    modulo: Video & Analytics
    widget: null
    pubblico: [titolare, agente, segreteria, b2c_client]
    livello: base
    tags: [501, limiti, video, cap23, ken-burns, b2c, kling, d-064, a-026]
    correlati: [video.cos-e, video.crediti, video.limitazioni-v1]
    domanda_naturale: "Esiste Ken Burns? Perché in agenzia dà 501? Dove è gratis?"
    contenuto:
      a_cosa_serve: >
        Chiarire lo split D-064: Ken Burns ffmpeg gratis SOLO sul
        portale B2C (/api/cloud/videos/kenburns/...). Nel gestionale
        agenzia l'endpoint kenburns torna 501 e si usa Kling Pro a
        crediti (D-065/D-066).
      quando_si_usa: >
        Quando un agente chiede il video gratis nel CRM, o un privato
        genera micro-tour sulla scheda ImmobilCloud.
      passi:
        - "Agenzia ImmoWeb: POST /api/app/videos/kling/property/{pid}
          (crediti + FAL_KEY). Ken Burns app → 501."
        - "Portale B2C ImmobilCloud: Ken Burns cloud gratuito dalle foto."
        - "Non riaprire Ken Burns free in agenzia senza decisione Founder
          (A-026)."
      errori_comuni:
        - problema: "kenburns_disabled_in_agency / 501"
          soluzione: >
            Atteso. Usa Kling a crediti oppure genera video dal portale
            cloud se l'annuncio è sul B2C.
        - problema: "402 crediti insufficienti su Kling"
          soluzione: "Ricarica crediti / verifica piano (Cap. 19)."
      permessi:
        - "Kling: utenti agenzia autenticati con crediti"
        - "Ken Burns cloud: flusso portale B2C"
    screenshot: []


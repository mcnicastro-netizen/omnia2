# HAL — Voci esportate per RAG
# Capitolo 18 · Notifiche e attività
# Onestà documentale D-051: v1 NON ha un modulo Notifiche dedicato né un feed Attività.
# Il capitolo documenta email transazionali (Resend, 7 template) + toast in-app (sonner) +
# cron saved-searches (super_admin only) + audit trail interno (Mongo, no UI) +
# lista esaustiva di cosa NON esiste v1.

voci:

  # ---------- 18.1 · Cos'è ----------

  - id: notifiche.cos-e
    titolo: Cos'è "Notifiche e attività" in OMNIA v1
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, segreteria, super_admin, b2c_client]
    livello: base
    tags: [notifiche, attivita, panoramica, d-051, onesta-documentale, cosa-non-fa]
    correlati: [notifiche.canali-attivi, notifiche.limitazioni-v1, notifiche.dashboard-vs-activity-feed]
    domanda_naturale: "Cos'è il modulo Notifiche di OMNIA? C'è un centro notifiche in-app? Esiste una campanella? OMNIA ha un feed attività recenti?"
    contenuto:
      a_cosa_serve: >
        Definire onestamente cosa OMNIA v1 offre come "notifiche e attività":
        (1) email transazionali Resend (7 template · welcome, password_reset,
        agency_invite, lead_notification, saved_search_alert, founders_welcome,
        founders_admin_notification), (2) toast in-app sonner (feedback azione),
        (3) cron saved-searches super_admin (digest B2C instant/daily/weekly),
        (4) audit trail interno Mongo (~10 collezioni, non esposte in UI).
      quando_si_usa: >
        Quando vuoi capire dove aspettarti notifiche in OMNIA e cosa NON
        troverai (Bell icon, pagina Notifiche, feed attività dashboard,
        push mobile, SMS, WhatsApp, preferenze granulari, digest quotidiana
        per titolare).
      passi:
        - "OMNIA v1 NON ha una pagina Notifiche né una Bell icon."
        - "OMNIA v1 NON ha un feed Attività recenti nella Dashboard
          (solo KPI counters immobili/lead/match/visite/collaboratori/inviti)."
        - "Le uniche notifiche esterne v1 sono email transazionali Resend
          triggerate da eventi specifici (registrazione, password, invito,
          lead, saved-search)."
        - "Le uniche notifiche in-app v1 sono toast sonner (feedback
          immediato, 4-5s, non persistenti)."
        - "L'audit trail interno esiste in Mongo (al_audit, match_audit,
          publishing_events, ecc.) ma NON è consultabile da UI: solo
          super_admin via query Mongo diretta."
      errori_comuni:
        - problema: "Cerco una campanella / centro notifiche in UI"
          soluzione: >
            Non esiste v1. Le uniche notifiche sono email nella tua casella
            e toast temporanei. Backlog A-017 (Notification center in-app)
            proposto per v1.1.
      permessi:
        - Tutti gli utenti autenticati vedono i toast in-app
        - I titolari ricevono email transazionali (welcome, invite, lead)
        - I B2C ricevono saved-search alert se `notification_channels` include "email"
        - Solo super_admin puo' lanciare il cron saved-searches
    screenshot:
      - "[SCREEN: cap18-dashboard-kpi]"

  # ---------- 18.2 · Dove trovarlo ----------

  - id: notifiche.dove-trovarlo
    titolo: Dove trovo le notifiche in OMNIA
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, segreteria, super_admin, b2c_client]
    livello: base
    tags: [notifiche, dove-trovarlo, ui-ux, nessuna-pagina, casella-email]
    correlati: [notifiche.cos-e, notifiche.toast-in-app, notifiche.email-panoramica]
    domanda_naturale: "Dove trovo la pagina Notifiche in OMNIA? Come vedo le notifiche non lette?"
    contenuto:
      a_cosa_serve: >
        Chiarire la posizione delle notifiche in OMNIA v1: nessuna pagina
        dedicata, tutte le esperienze notification-like sono distribuite
        (casella email personale + toast immediato + email di benvenuto).
      quando_si_usa: >
        Quando cerchi una pagina Notifiche e non la trovi in menu.
      passi:
        - "Le email arrivano nella tua casella di posta personale
          (Gmail/Outlook/etc.), NON in una inbox OMNIA."
        - "I toast in-app appaiono in basso a destra dello schermo per
          4-5 secondi dopo un'azione, poi spariscono."
        - "Il cron saved-searches puo' essere lanciato solo da super_admin
          via POST /api/app/cron/saved-searches/run-all."
        - "In ImmoWeb la Dashboard mostra 6 KPI counter (Immobili attivi,
          Lead aperti, Nuovi match 7gg, Visite 7gg, Collaboratori,
          Inviti pendenti) MA NON un feed attività."
        - "In ImmobilCloud non c'e' una voce di menu Notifiche: solo email
          nella casella se hai saved-searches attive."
      errori_comuni:
        - problema: "Non trovo la voce Notifiche nel menu laterale"
          soluzione: >
            Corretto: non esiste v1. Cerca eventuali email nella tua
            casella o attiva una saved-search in ImmobilCloud per
            ricevere alert per email.
      permessi:
        - Nessuna pagina Notifiche accessibile v1 (non esiste)
    screenshot: []

  # ---------- 18.3 · Canali attivi ----------

  - id: notifiche.canali-attivi
    titolo: Canali di notifica attivi v1 (email + toast · NO push/SMS/WhatsApp)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, super_admin]
    livello: base
    tags: [notifiche, canali, email, toast, push, sms, whatsapp, dead-code, d-051]
    correlati: [notifiche.email-panoramica, notifiche.toast-in-app, notifiche.limitazioni-v1]
    domanda_naturale: "Su quali canali OMNIA invia notifiche? Esiste push mobile, SMS o WhatsApp?"
    contenuto:
      a_cosa_serve: >
        Elencare in modo esaustivo i canali di notifica supportati e NON
        supportati v1, con nota sul dead code `push` nello schema utente.
      quando_si_usa: >
        Prima di aspettarti un SMS di conferma appuntamento o un push
        mobile su nuovo lead.
      passi:
        - "ATTIVO · Email transazionali via Resend (7 template · fallback
          mock mode se RESEND_API_KEY non configurata)."
        - "ATTIVO · Toast in-app via libreria sonner (React), durata
          4-5 secondi, non persistenti."
        - "NON ATTIVO · Push web/mobile. Lo schema `notification_channels`
          accetta il valore 'push' ma NESSUN sender push e' implementato
          v1. E' dead code documentato per trasparenza."
        - "NON ATTIVO · SMS (nessuna integrazione Twilio o simili)."
        - "NON ATTIVO · WhatsApp Business (nessuna integrazione Meta)."
        - "NON ATTIVO · Slack/Teams/Discord webhook per alert admin."
        - "NON ATTIVO · Voice call (Twilio Voice non configurato)."
      errori_comuni:
        - problema: "Ho attivato push in registrazione ma non ricevo nulla"
          soluzione: >
            Lo schema accetta 'push' come valore ma nessun sender push
            e' implementato v1 (dead code). Usa email come unico canale
            realmente attivo.
      permessi:
        - Ogni utente puo' vedere i toast in-app
        - Solo email e' realmente consegnato
    screenshot: []

  # ---------- 18.4 · Email panoramica ----------

  - id: notifiche.email-panoramica
    titolo: Email transazionali · 7 template Resend (welcome, password_reset, agency_invite, lead_notification, saved_search_alert, founders_welcome, founders_admin_notification)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [notifiche, email, resend, template, transazionali, multilingua, mock-mode, d-051]
    correlati: [notifiche.template-welcome-password, notifiche.template-agency-invite, notifiche.template-lead-notification, notifiche.template-saved-search-alert, notifiche.errori-comuni]
    domanda_naturale: "Quali email invia OMNIA automaticamente? Che template esistono? Come funziona il mock mode?"
    contenuto:
      a_cosa_serve: >
        Panoramica dei 7 template email transazionali gestiti da
        shared/email/client.py via Resend API con fallback mock mode.
      quando_si_usa: >
        Quando devi capire quali email OMNIA spedisce automaticamente,
        con che subject/lingua/trigger, e come debuggare in dev.
      passi:
        - "welcome (it/en/es): triggerato da POST /api/auth/register
          B2B in apps/core/auth.py:131. Subject 'Benvenuto in OMNIA'."
        - "password_reset (it/en/es): triggerato da POST
          /api/auth/forgot-password in apps/core/auth.py:273.
          Token TTL 1h. Idempotente (risposta identica se email non esiste)."
        - "agency_invite (it/en/es): titolare invita collaboratore in
          apps/immoweb/invites.py:102. Magic-link TTL 7gg nel fragment URL.
          Cross-ref Cap. 13."
        - "lead_notification (it/en/es): form contatto portale pubblico
          in apps/immocloud/public_portal.py:750. Va all'agente owner."
        - "saved_search_alert (it/en/es): cron admin lancia
          run_all_active_saved_searches() in
          apps/immocloud/saved_searches.py:245. Digest HTML max 6 righe."
        - "founders_welcome (solo it): signup Founders in
          apps/marketing/founders.py:103."
        - "founders_admin_notification (solo it): notifica admin OMNIA
          post-signup Founders in apps/marketing/founders.py:120."
        - "Lingua fallback: se il template richiesto non ha la lingua,
          fallback su 'it'."
        - "Mock mode: se RESEND_API_KEY non configurata, l'email NON
          viene spedita, solo loggata con prefix `[EMAIL MOCK]`."
        - "Assets iniettati automaticamente: logo_url (env
          OMNIA_LOGO_URL) e public_base (env OMNIA_PUBLIC_URL)."
      errori_comuni:
        - problema: "Vedo `[EMAIL MOCK]` nei log e nessuna email arriva"
          soluzione: >
            Configura RESEND_API_KEY nel backend .env. Riavvia il
            backend. Le email successive andranno realmente spedite.
      permessi:
        - "Fire-and-forget (fallimenti solo loggati, no retry queue)"
    screenshot:
      - "[SCREEN: cap18-email-welcome]"

  # ---------- 18.5 · welcome + password_reset ----------

  - id: notifiche.template-welcome-password
    titolo: Template welcome + password_reset (Cap. 1 auth)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, super_admin]
    livello: intermedio
    tags: [notifiche, email, welcome, password-reset, registrazione, auth, cap1]
    correlati: [notifiche.email-panoramica, notifiche.errori-comuni]
    domanda_naturale: "Quando arriva l'email di benvenuto? Come funziona il reset password via email?"
    contenuto:
      a_cosa_serve: >
        Documentare i due template piu' fondamentali del flusso di
        registrazione B2B ImmoWeb: benvenuto e recupero password.
      quando_si_usa: >
        Dopo la registrazione (welcome) o quando l'utente clicca su
        "Password dimenticata" (password_reset).
      passi:
        - "welcome trigger: subito dopo POST /api/auth/register (B2B).
          Fire-and-forget: l'errore email NON blocca la registrazione."
        - "welcome variabili: {{user_name}}."
        - "welcome subject: 'Benvenuto in OMNIA' (it) · 'Welcome to
          OMNIA' (en) · 'Bienvenido a OMNIA' (es)."
        - "password_reset trigger: POST /api/auth/forgot-password con
          email valida. Idempotente: la risposta e' identica anche
          se l'email non esiste (protezione anti-enumeration)."
        - "password_reset variabili: {{user_name}}, {{reset_url}}
          (link con token TTL 1h)."
        - "password_reset TTL token: 1h (index Mongo TTL su
          collezione password_reset_tokens)."
        - "password_reset subject: 'Reimposta la tua password OMNIA'."
      errori_comuni:
        - problema: "Ho fatto reset password ma il link non funziona piu'"
          soluzione: >
            Il token dura 1h. Se sono passate piu' di 60 minuti, rifai
            la richiesta di reset da /forgot-password. Il vecchio token
            e' invalidato.
        - problema: "Non ricevo l'email di benvenuto"
          soluzione: >
            Verifica cartella spam. Se in dev, controlla log backend per
            `[EMAIL MOCK]` (Resend non configurata). Se in prod, controlla
            log per `[EMAIL ERROR]` (rate limit / dominio non verificato).
      permessi:
        - "Chiunque puo' registrarsi (B2B) → welcome"
        - "Chiunque puo' richiedere password_reset (idempotente)"
    screenshot:
      - "[SCREEN: cap18-email-welcome]"

  # ---------- 18.6 · agency_invite ----------

  - id: notifiche.template-agency-invite
    titolo: Template agency_invite (Cap. 13 team · magic-link 7 giorni)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [notifiche, email, agency-invite, team, collaboratori, magic-link, cap13]

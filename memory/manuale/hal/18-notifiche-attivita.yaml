    contenuto:
      a_cosa_serve: >
        Mappa dei trigger notifica/audit dagli altri moduli.
      quando_si_usa: >
        Quando devi risalire da un evento (invito, lead, sync) al
        modulo che lo ha originato.
      passi:
        - "Cap. 1 Primo accesso → trigger welcome (registrazione B2B)
          + password_reset (recupero password)."
        - "Cap. 3 Immobili → trigger audit privacy_audit_events al
          cambio livello privacy (L1-L4)."
        - "Cap. 5 Match → trigger audit match_audit ad ogni proposta
          match generata + KPI counter Dashboard."
        - "Cap. 6 Publishing → trigger audit publishing_events al
          run sync portale."
        - "Cap. 10 HAL Agent CRM → trigger audit al_audit ad ogni chat
          + improve (rate limit + cost tracking)."
        - "Cap. 12 HAL Knowledge → trigger audit hal_knowledge_sessions
          per ogni domanda RAG."
        - "Cap. 13 Team & Ruoli → trigger email agency_invite
          (magic-link 7gg)."
        - "Cap. 15 Social Publisher → trigger audit social_posts ad
          ogni push canale (success/failed). NO email v1."
        - "Cap. 17 Domain Vault → trigger audit domain_vault_events
          per sovereignty/DNS/connect."
        - "Cap. 27 MLS Network placeholder → nessun trigger v1."
      errori_comuni: []
      permessi:
        - "N/A · documentativo"

  # ---------- 18.13 · dashboard vs activity feed ----------

  - id: notifiche.dashboard-vs-activity-feed
    titolo: Dashboard KPI counters vs Activity feed (chiarimento D-051)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, super_admin]
    livello: base
    tags: [attivita, dashboard, kpi, counters, activity-feed, onesta, d-051, no-timeline]
    correlati: [notifiche.audit-trail-interno, notifiche.cos-e, notifiche.limitazioni-v1]
    domanda_naturale: "La Dashboard mostra le attivita' recenti? C'e' una timeline di quello che succede?"
    contenuto:
      a_cosa_serve: >
        Chiarire in modo onesto (D-051) la differenza fra la Dashboard
        KPI attuale e un vero activity feed (che NON esiste v1).
      quando_si_usa: >
        Quando un utente cerca una timeline "chi ha fatto cosa quando"
        nella Dashboard.
      passi:
        - "La Dashboard ImmoWeb ha 6 KPI counters aggiornati on-read
          (nessuna cache)."
        - "1) Immobili attivi: count status IN ('published',
          'reserved')."
        - "2) Lead aperti: count clients_leads status='open'."
        - "3) Nuovi match (7gg): count match_audit created_at >=
          now - 7d."
        - "4) Visite (7gg): count calendar_events event_type='visit'
          event_at BETWEEN now AND now+7d."
        - "5) Collaboratori: count membri accepted dell'agency."
        - "6) Inviti pendenti: count invites status='pending'."
        - "COSA NON E': NON e' una timeline 'Ultime 20 attivita'',
          NON e' una lista eventi cliccabili con drill-down, NON
          mostra chi ha creato ultimo immobile / risposto ultimo
          lead / lanciato ultima sync."
        - "Backlog A-018 (Activity feed dashboard) proposto per v1.1
          per aggregare gli audit trail in timeline."
      errori_comuni:
        - problema: "Voglio vedere le ultime azioni dei collaboratori"
          soluzione: >
            Non esiste v1. Solo query Mongo diretta agli audit
            (super_admin) puo' mostrare storico per-utente.
      permessi:
        - "Tutti i membri agenzia vedono i KPI counters dell'agency"
    screenshot:
      - "[SCREEN: cap18-dashboard-kpi]"

  # ---------- 18.14 · errori comuni ----------

  - id: notifiche.errori-comuni
    titolo: Errori comuni notifiche (email mock, template variabili, cron non lanciato)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [notifiche, errori, debug, email-mock, resend, template, cron, troubleshooting]
    correlati: [notifiche.email-panoramica, notifiche.cron-saved-searches, notifiche.template-welcome-password]
    domanda_naturale: "Perche' non ricevo le email di OMNIA? Come debuggo problemi con le notifiche?"
    contenuto:
      a_cosa_serve: >
        Checklist troubleshooting per problemi comuni sulle notifiche
        (email non ricevute, template con placeholder letterali, cron
        non lanciato).
      quando_si_usa: >
        Quando un utente segnala "non mi arriva l'email".
      passi:
        - "E1 Non ricevo welcome/password_reset. Causa 1: RESEND_API_KEY
          non configurata → mock mode. Fix dev: guarda log per
          `[EMAIL MOCK]`. Fix prod: configura RESEND_API_KEY."
        - "E1 Causa 2: email in spam. Fix: whitelist EMAIL_FROM."
        - "E1 Causa 3: Resend rifiuta (rate limit / dominio non
          verificato). Fix: log backend cerca `[EMAIL ERROR]`."
        - "E2 Ho invitato un collega ma non riceve email. Vedi Cap. 13
          §13.11 + verifica `[EMAIL OK]` nei log."
        - "E3 Saved-search non invia mai email. Causa 1: nessun
          super_admin ha lanciato il cron. Fix: POST
          /api/app/cron/saved-searches/run-all. Causa 2: nessun match
          nuovo. Causa 3: notification_channels non contiene 'email'.
          Causa 4: is_active=false."
        - "E4 Toast in-app spariscono troppo veloci. Comportamento
          default sonner ~4-5s. Backlog A-023."
        - "E5 Email arriva ma variabili sono letterali `{{user_name}}`.
          Causa: chiamata send_email senza passare la variabile.
          Fix: super_admin apre template HTML in shared/email/
          templates/ e verifica placeholder passati nel variables dict."
      errori_comuni:
        - problema: "Log backend mostra `[EMAIL MOCK]`"
          soluzione: >
            RESEND_API_KEY manca. In dev e' comportamento atteso
            (nessuna email reale). In prod, configura la chiave.
      permessi:
        - "Debug richiede accesso a log backend (dev o super_admin prod)"
    screenshot: []

  # ---------- 18.14b · D-093 preferiti + stats privato ----------

  - id: notifiche.d093-preferiti-stats
    titolo: Gap Idealista/Immobiliare P0 — stats privato e alert preferiti terminati (D-093)
    modulo: Notifiche
    widget: null
    pubblico: [b2c_client, titolare, super_admin]
    livello: base
    tags: [d-093, a-029, a-030, preferiti, stats, privato, sellpage, idealista, immobiliare, ribasso, venduto]
    correlati: [notifiche.template-saved-search-alert, notifiche.limitazioni-v1, notifiche.inquiry-annuncio-privato]
    domanda_naturale: >
      Posso vedere quante persone hanno visto il mio annuncio privato?
      Ricevo un avviso se un preferito viene venduto o ritirato come su Idealista?
    contenuto:
      a_cosa_serve: >
        Chiude i due gap P0 vs Idealista/Immobiliare.it: (1) il privato vede
        visualizzazioni scheda e contatti sul proprio annuncio; (2) chi ha
        salvato un preferito viene avvisato se l'annuncio finisce
        (venduto/affittato/ritirato), oltre al ribasso prezzo già attivo.
      quando_si_usa: >
        Dopo login B2C su ImmobilCloud → area Vendi (stats) o Account → Preferiti
        (badge + alert).
      passi:
        - "Stats · GET /api/cloud/me/properties/{id}/stats?days=30 (owner only)."
        - "UI · SellPage pannello Prestazioni: lifetime views/leads + serie 30g."
        - "Onesta' · views = aperture scheda; leads = messaggi contatto; NON impressioni feed."
        - "Alert ended · status sold|rented|withdrawn → inbox favorite_listing_ended + email."
        - "Lista preferiti tiene gli annunci terminati con badge (non spariscono)."
        - "Backlog P1/P2 · A-031 liste/note · A-032 digest · A-033 confronto+push."
      errori_comuni:
        - problema: "La serie 30g e' a zero ma ho avuto view in passato"
          soluzione: >
            I bucket giornalieri partono dal deploy D-093; i totali lifetime
            restano su view_count/lead_count dell'immobile.
      permessi:
        - "Stats solo owner B2C dell'annuncio privato."
    screenshot: [cap18-sell-stats, cap18-fav-ended-badge]

  # ---------- 18.15 · limitazioni v1 ----------

  - id: notifiche.limitazioni-v1
    titolo: Limiti v1 Notifiche e attivita' (D-051 onesto · elenco esaustivo)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, super_admin, b2c_client]
    livello: intermedio
    tags: [notifiche, attivita, limiti, cosa-non-fa, no-bell, no-activity-feed, no-push, no-sms, no-whatsapp, no-preferenze-ui, no-retry, no-webhook, onesta, d-051]
    correlati: [notifiche.cos-e, notifiche.canali-attivi, notifiche.preferenze-utente]
    domanda_naturale: "Cosa NON fa il modulo Notifiche v1? OMNIA ha campanella, unread badge, push mobile, SMS, WhatsApp, digest quotidiana, preferenze granulari, moderazione, retry queue, tracking delivery, opt-in per tipo email?"
    contenuto:
      a_cosa_serve: >
        Elenco esaustivo di cosa il modulo Notifiche v1 NON fa,
        rispettando l'Onesta' Documentale D-051.
      quando_si_usa: >
        Prima di aspettarti una Bell icon, una pagina Notifiche o un
        SMS di conferma appuntamento.
      passi:
        - "ESISTE · Router /api/notifications + collezione Mongo (A-017)."
        - "ESISTE · Bell icon + badge unread + mark read (A-017)."
        - "ESISTE · Preferenze UI canale/tipo (A-021)."
        - "ESISTE · Alert preferiti ribasso + annuncio terminato (D-093 / A-030)."
        - "ESISTE · Stats privato view/lead su SellPage (D-093 / A-029)."
        - "BACKEND · NO router /activity o activity feed (A-018)."
        - "BACKEND · NO servizio push sender (schema 'push' dead code · A-033)."
        - "BACKEND · NO liste/note preferiti / digest settimanale (A-031 / A-032)."
        - "BACKEND · NO coda retry email / webhook Resend delivery."
        - "BACKEND · Scheduler interno saved-search (A-020 ✅) + pass preferiti."
        - "BACKEND · Emitter residuali: match on-read, import, social,
          compliance, DNS non ancora in campanella."
        - "FRONTEND · NO pagina full-screen Notifiche (solo dropdown)."
        - "FRONTEND · NO mute/snooze / moderazione admin."
        - "CHANNELS · NO SMS / WhatsApp / Push web-mobile / Slack."
        - "password_reset sempre inviata (non disattivabile)."
        - "Metriche privato: aperture scheda + contatti — NON impressioni feed."
      errori_comuni:
        - problema: "Voglio ricevere notifiche mobile push"
          soluzione: >
            Non disponibile. Usa email + campanella.
        - problema: "Voglio disattivare le email di password_reset"
          soluzione: >
            Non consentito (sempre on).
      permessi:
        - "N/A · limitazioni informative"
    screenshot: []


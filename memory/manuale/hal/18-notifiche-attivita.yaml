  # ---------- 18.4 · Email panoramica ----------

  - id: notifiche.email-panoramica
    titolo: Email transazionali · 7 template Resend (welcome, password_reset, agency_invite, lead_notification, saved_search_alert, founders_welcome, founders_admin_notification)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [notifiche, email, resend, template, transazionali, multilingua, mock-mode, d-051]
    correlati: [notifiche.template-welcome-password, notifiche.template-agency-invite, notifiche.template-lead-notification, notifiche.template-saved-search-alert, notifiche.errori-comuni]
    domanda_naturale: "Quali email invia OMNIA automaticamente? Che template esistono? Come funziona il mock mode?"
    contenuto:
      a_cosa_serve: >
        Panoramica dei 7 template email transazionali gestiti da
        shared/email/client.py via Resend API con fallback mock mode.
      quando_si_usa: >
        Quando devi capire quali email OMNIA spedisce automaticamente,
        con che subject/lingua/trigger, e come debuggare in dev.
      passi:
        - "welcome (it/en/es): triggerato da POST /api/auth/register
          B2B in apps/core/auth.py:131. Subject 'Benvenuto in OMNIA'."
        - "password_reset (it/en/es): triggerato da POST
          /api/auth/forgot-password in apps/core/auth.py:273.
          Token TTL 1h. Idempotente (risposta identica se email non esiste)."
        - "agency_invite (it/en/es): titolare invita collaboratore in
          apps/immoweb/invites.py:102. Magic-link TTL 7gg nel fragment URL.
          Cross-ref Cap. 13."
        - "lead_notification (it/en/es): form contatto portale pubblico
          in apps/immocloud/public_portal.py:750. Va all'agente owner."
        - "saved_search_alert (it/en/es): cron admin lancia
          run_all_active_saved_searches() in
          apps/immocloud/saved_searches.py:245. Digest HTML max 6 righe."
        - "founders_welcome (solo it): signup Founders in
          apps/marketing/founders.py:103."
        - "founders_admin_notification (solo it): notifica admin OMNIA
          post-signup Founders in apps/marketing/founders.py:120."
        - "Lingua fallback: se il template richiesto non ha la lingua,
          fallback su 'it'."
        - "Mock mode: se RESEND_API_KEY non configurata, l'email NON
          viene spedita, solo loggata con prefix `[EMAIL MOCK]`."
        - "Assets iniettati automaticamente: logo_url (env
          OMNIA_LOGO_URL) e public_base (env OMNIA_PUBLIC_URL)."
      errori_comuni:
        - problema: "Vedo `[EMAIL MOCK]` nei log e nessuna email arriva"
          soluzione: >
            Configura RESEND_API_KEY nel backend .env. Riavvia il
            backend. Le email successive andranno realmente spedite.
      permessi:
        - "Fire-and-forget (fallimenti solo loggati, no retry queue)"
    screenshot:
      - "[SCREEN: cap18-email-welcome]"

  # ---------- 18.5 · welcome + password_reset ----------

  - id: notifiche.template-welcome-password
    titolo: Template welcome + password_reset (Cap. 1 auth)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, super_admin]
    livello: intermedio
    tags: [notifiche, email, welcome, password-reset, registrazione, auth, cap1]
    correlati: [notifiche.email-panoramica, notifiche.errori-comuni]
    domanda_naturale: "Quando arriva l'email di benvenuto? Come funziona il reset password via email?"
    contenuto:
      a_cosa_serve: >
        Documentare i due template piu' fondamentali del flusso di
        registrazione B2B ImmoWeb: benvenuto e recupero password.
      quando_si_usa: >
        Dopo la registrazione (welcome) o quando l'utente clicca su
        "Password dimenticata" (password_reset).
      passi:
        - "welcome trigger: subito dopo POST /api/auth/register (B2B).
          Fire-and-forget: l'errore email NON blocca la registrazione."
        - "welcome variabili: {{user_name}}."
        - "welcome subject: 'Benvenuto in OMNIA' (it) · 'Welcome to
          OMNIA' (en) · 'Bienvenido a OMNIA' (es)."
        - "password_reset trigger: POST /api/auth/forgot-password con
          email valida. Idempotente: la risposta e' identica anche
          se l'email non esiste (protezione anti-enumeration)."
        - "password_reset variabili: {{user_name}}, {{reset_url}}
          (link con token TTL 1h)."
        - "password_reset TTL token: 1h (index Mongo TTL su
          collezione password_reset_tokens)."
        - "password_reset subject: 'Reimposta la tua password OMNIA'."
      errori_comuni:
        - problema: "Ho fatto reset password ma il link non funziona piu'"
          soluzione: >
            Il token dura 1h. Se sono passate piu' di 60 minuti, rifai
            la richiesta di reset da /forgot-password. Il vecchio token
            e' invalidato.
        - problema: "Non ricevo l'email di benvenuto"
          soluzione: >
            Verifica cartella spam. Se in dev, controlla log backend per
            `[EMAIL MOCK]` (Resend non configurata). Se in prod, controlla
            log per `[EMAIL ERROR]` (rate limit / dominio non verificato).
      permessi:
        - "Chiunque puo' registrarsi (B2B) → welcome"
        - "Chiunque puo' richiedere password_reset (idempotente)"
    screenshot:
      - "[SCREEN: cap18-email-welcome]"

  # ---------- 18.6 · agency_invite ----------

  - id: notifiche.template-agency-invite
    titolo: Template agency_invite (Cap. 13 team · magic-link 7 giorni)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, super_admin]
    livello: intermedio
    tags: [notifiche, email, agency-invite, team, collaboratori, magic-link, cap13]
    correlati: [notifiche.email-panoramica, notifiche.errori-comuni]
    domanda_naturale: "Come arriva l'invito email quando aggiungo un collaboratore in agenzia?"
    contenuto:
      a_cosa_serve: >
        Documentare il template email agency_invite triggerato dagli
        inviti team (Cap. 13).
      quando_si_usa: >
        Quando il titolare (o super_admin) invita un nuovo membro da
        POST /api/agencies/me/invites.
      passi:
        - "Trigger: apps/immoweb/invites.py:102 dopo creazione invito."
        - "A chi: email del collaboratore invitato (email specificata
          nel form invito)."
        - "Variabili: {{agency_name}}, {{inviter_name}}, {{role_label}},
          {{invite_url}}."
        - "Subject: 'Sei stato invitato a unirti a {{agency_name}} su
          OMNIA' (it) · analoghi en/es."
        - "Magic-link: token nel FRAGMENT URL (#token=...), NON nella
          query string, per best practice OWASP (nessun leak nel
          Referer HTTP header)."
        - "TTL: 7 giorni (documentato Cap. 13)."
        - "Lingua: dedotta dalla lingua dell'invitatore (o fallback 'it')."
      errori_comuni:
        - problema: "L'invito email non arriva al collaboratore"
          soluzione: >
            Vedi Cap. 13 §13.11. Controlla log `[EMAIL OK]` o
            `[EMAIL MOCK]`. Se mock, configura Resend.
      permessi:
        - "Solo titolare o super_admin puo' invitare"
    screenshot:
      - "[SCREEN: cap18-email-agency-invite]"

  # ---------- 18.7 · lead_notification (agenzia) ----------

  - id: notifiche.template-lead-notification
    titolo: Template lead_notification (annuncio agenzia → CRM + agente)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente]
    livello: intermedio
    tags: [notifiche, email, lead-notification, portale-pubblico, contatti, b2c, immobilcloud, agenzia]
    correlati: [notifiche.email-panoramica, notifiche.errori-comuni, notifiche.inquiry-annuncio-privato]
    domanda_naturale: "Come mi arriva la notifica quando un visitatore lascia un contatto su un mio immobile di agenzia?"
    contenuto:
      a_cosa_serve: >
        Documentare la mail e l'inbox in-app quando un visitatore
        contatta un annuncio PUBBLICATO DA AGENZIA su ImmobilCloud.
        Nascono client + lead CRM (source ImmobilCloud).
      quando_si_usa: >
        Scheda immobile con agency_id reale (non _private_listings):
        form «Contatta l'agenzia».
      passi:
        - "Trigger: POST /api/cloud/property/{pid}/contact su annuncio agenzia."
        - "Crea/riusa client CRM + lead; incrementa lead_count."
        - "Email: listing agent (se lead_notification consentito) oppure email agenzia."
        - "In-app: tipo lead_new a listing agent + owner/admin."
        - "NON vale per annunci privati B2C → vedi notifiche.inquiry-annuncio-privato."
      errori_comuni:
        - problema: "Ho ricevuto il lead ma non vedo il numero di telefono"
          soluzione: >
            Il visitatore puo' aver lasciato solo email.
        - problema: "Il lead e' arrivato al titolare invece che all'agente"
          soluzione: >
            L'agente owner probabilmente non ha email o ha disattivato
            il tipo lead_notification nelle preferenze.
      permessi:
        - "Agent owner dell'immobile (o titolare/agenzia fallback) riceve email"
    screenshot:
      - "[SCREEN: cap18-email-lead-notification]"

  # ---------- 18.7b · listing_inquiry (privato) ----------

  - id: notifiche.inquiry-annuncio-privato
    titolo: Contatto su annuncio privato B2C (inquiry, non lead CRM)
    modulo: Notifiche
    widget: null
    pubblico: [b2c_client, titolare, agente, super_admin]
    livello: intermedio
    tags: [notifiche, inquiry, annuncio-privato, immobilcloud, whatsapp, email, telefono, b2c, listing-inquiry]
    correlati: [notifiche.template-lead-notification, notifiche.email-panoramica]
    domanda_naturale: "Cosa succede se qualcuno contatta un annuncio privato su ImmobilCloud? Arriva nel CRM? Come attivo telefono e WhatsApp sull'annuncio?"
    contenuto:
      a_cosa_serve: >
        Spiegare il flusso distinto dagli annunci agenzia: il messaggio
        va al venditore privato (email + campanella listing_inquiry),
        salvato in listing_inquiries, SENZA creare client/lead nel CRM
        agenzia (_private_listings).
      quando_si_usa: >
        Annuncio is_private_listing=true pubblicato da account B2C
        (Vendi). Visitatore usa Contatta il venditore o i canali opt-in.
      passi:
        - "In Vendi il privato sceglie canali pubblici: show_email,
          show_phone, show_whatsapp (+ numeri). Il form messaggio resta
          attivo se ha email account."
        - "Sul dettaglio: publisher.kind=private, canali visibili solo
          se opt-in; form → POST /property/{pid}/contact."
        - "Backend: insert listing_inquiries; email con template
          lead_notification; in-app type=listing_inquiry al owner_user_id."
        - "Risposta API: { ok, inquiry_id, kind: 'private' }."
        - "Se stai guardando il tuo annuncio (viewer_is_lister): niente form."
      errori_comuni:
        - problema: "Mi aspettavo di vedere il contatto nei Clienti CRM"
          soluzione: >
            Gli annunci privati non creano lead agenzia. Cerca nella
            campanella (listing_inquiry) o nell'email del venditore.
        - problema: "Telefono/WhatsApp non compaiono sull'annuncio"
          soluzione: >
            Devono essere attivati in Vendi (toggle + numero valorizzato)
            e l'annuncio ripubblicato/salvato.
      permessi:
        - "Solo il owner_user_id dell'annuncio privato riceve inquiry"
    screenshot: []

  # ---------- 18.8 · saved_search_alert ----------

  - id: notifiche.template-saved-search-alert
    titolo: Template saved_search_alert (B2C ImmobilCloud · digest HTML max 6 righe)
    modulo: Notifiche
    widget: null
    pubblico: [b2c_client, super_admin]
    livello: intermedio
    tags: [notifiche, email, saved-search, digest, b2c, immobilcloud, cron, frequenza]
    correlati: [notifiche.cron-saved-searches, notifiche.email-panoramica, notifiche.preferenze-utente]
    domanda_naturale: "Come funziona l'email di alert per le ricerche salvate su ImmobilCloud?"
    contenuto:
      a_cosa_serve: >
        Documentare il template digest email inviato agli utenti B2C
        ImmobilCloud quando le loro ricerche salvate producono nuovi
        match.
      quando_si_usa: >
        Quando il cron admin (super_admin only) lancia
        run_all_active_saved_searches() e trova >= 1 match nuovo
        rispetto al last_run_at della ricerca.
      passi:
        - "Trigger indiretto: cron super_admin lancia
          POST /api/app/cron/saved-searches/run-all."
        - "A chi: utente B2C con account_type='b2c' E 'email' in
          notification_channels E saved_search is_active=true E almeno
          1 match nuovo da last_run_at."
        - "Variabili: {{user_name}}, {{search_name}}, {{match_count}},
          {{matches_html}} (tabella HTML fino a 6 righe), {{search_url}}."
        - "Subject: '🔔 {{match_count}} nuovi immobili per la tua
          ricerca \"{{search_name}}\"'."
        - "matches_html: tabella HTML con max 6 righe visibili. Il
          match_count reale puo' essere maggiore (indicato nel subject
          e nel corpo)."
        - "Frequenza instant|daily|weekly: il cron RISPETTA il gate
          (daily ≥20h, weekly ≥6g) e non avanza last_run_at sullo skip
          (A-019 chiuso 16-Sep-2026)."
      errori_comuni:
        - problema: "La saved-search non mi manda mai email"
          soluzione: >
            Verifica (1) is_active=true, (2) account_type='b2c',
            (3) 'email' in notification_channels, (4) frequency non
            ancora scaduta, (5) scheduler orario o trigger manuale.
        - problema: "Ricevo email anche per ricerche disattivate"
          soluzione: >
            Bug non riproducibile v1 (query filtra is_active=true).
            Verifica su Mongo il valore reale.
      permessi:
        - "Utenti B2C (account_type='b2c') con email in
          notification_channels"
    screenshot:
      - "[SCREEN: cap18-email-saved-search]"

  # ---------- 18.9 · toast in-app ----------

  - id: notifiche.toast-in-app
    titolo: Toast in-app (feedback immediato azione utente via sonner)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, segreteria, super_admin, b2c_client]
    livello: base
    tags: [notifiche, toast, sonner, in-app, feedback, ui, ephemera]
    correlati: [notifiche.canali-attivi, notifiche.limitazioni-v1]
    domanda_naturale: "Cosa sono i toast in OMNIA? Perche' spariscono cosi' velocemente?"
    contenuto:
      a_cosa_serve: >
        Feedback immediato non-persistente per ogni azione utente
        (successo/errore/info) via libreria sonner integrata in
        components/ui/sonner.jsx.
      quando_si_usa: >
        Dopo ogni submit form (creazione immobile, salvataggio cliente,
        pagamento Stripe, invio invito, ecc.).
      passi:
        - "Uso in codice: `import { toast } from 'sonner';
          toast.success('...'); toast.error('...');`."
        - "Provider Toaster montato in App.js root."
        - "Durata di default: ~4-5 secondi (default sonner)."
        - "Posizione: in basso a destra dello schermo (default sonner)."
        - "Colori: verde per .success, rosso per .error, neutro per
          toast() generico."
      errori_comuni:
        - problema: "I toast spariscono troppo velocemente"
          soluzione: >
            Comportamento di default sonner (~4-5s). v1 non consente
            configurazione per toast singolo. Backlog A-023 (Toast
            duration tuning) proposto.
        - problema: "Ricarico la pagina e i toast pending scompaiono"
          soluzione: >
            I toast sonner sono ephemera in-memory: non persistono
            attraverso reload. E' un limite noto v1.
      permessi:
        - "Tutti gli utenti autenticati vedono i toast della propria
          sessione"
    screenshot:
      - "[SCREEN: cap18-toast-success]"
      - "[SCREEN: cap18-toast-error]"

  # ---------- 18.10 · cron saved-searches ----------

  - id: notifiche.cron-saved-searches
    titolo: Cron saved-searches (scheduler interno orario + trigger
      super_admin)
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: avanzato
    tags: [notifiche, cron, saved-search, super-admin, scheduler, apscheduler, digest, b2c]
    correlati: [notifiche.template-saved-search-alert, notifiche.preferenze-utente]
    domanda_naturale: "Le ricerche salvate partono da sole o serve un cron manuale?"
    contenuto:
      a_cosa_serve: >
        Processare le saved-searches attive e inviare digest/email +
        notifiche in-app. Dal 16-Sep-2026 gira anche da solo ogni ora.
      quando_si_usa: >
        Automatico ogni ora (:15 UTC). Il trigger super_admin resta
        per smoke/ops.
      passi:
        - "Scheduler: APScheduler job saved_searches_hourly in
          sync_engine.start_scheduler (ogni ora :15 UTC) — A-020."
        - "Endpoint manuale: POST /api/app/cron/saved-searches/run-all
          (super_admin only)."
        - "Gate frequenza A-019: instant sempre; daily ≥20h; weekly ≥6g.
          Skip senza avanzare last_run_at."
      errori_comuni:
        - problema: "emails_sent=0 anche se ho saved-searches attive"
          soluzione: >
            Verifica su ogni saved-search: is_active, account_type user
            B2C, canale email, tipo saved_search_alert, frequency non
            ancora scaduta, match nuovi da last_run_at.
      permessi:
        - Trigger manuale: solo super_admin
        - Scheduler: processo backend
    screenshot: []

  # ---------- 18.11 · preferenze utente (A-021) ----------

  - id: notifiche.preferenze-utente
    titolo: Preferenze notifiche UI (A-021) · canali e tipi email
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, segreteria, super_admin, b2c_client]
    livello: intermedio
    tags: [notifiche, preferenze, a-021, notification-channels, opt-in, opt-out, d-051]
    correlati: [notifiche.canali-attivi, notifiche.cos-e]
    domanda_naturale: "Come cambio le preferenze notifiche? Posso disattivare specifici tipi di email?"
    contenuto:
      a_cosa_serve: >
        Spiegare la UI e le API di preferenze dopo A-021.
      quando_si_usa: >
        Quando vuoi spegnere email lead o alert ricerche salvate.
      passi:
        - "UI B2B: Impostazioni → Preferenze notifiche."
        - "UI B2C: Account cloud → stesso pannello + frequenza digest."
        - "API GET/PATCH /api/auth/me/notification-preferences."
        - "Tipi toggleabili: welcome, agency_invite, lead_notification,
          saved_search_alert."
        - "password_reset sempre on (non disattivabile)."
        - "Canale push in UI disabilitato (non disponibile v1)."
        - "Inbox campanella indipendente dalle preferenze email."
      errori_comuni:
        - problema: "Ho disattivato lead_notification ma vedo ancora la campanella"
          soluzione: >
            Corretto: A-017 scrive inbox anche senza email. Solo la
            mail e' gated da user_allows_email.
      permessi:
        - Ogni utente modifica solo le proprie preferenze
    screenshot:
      - "[SCREEN: cap18-prefs-settings]"


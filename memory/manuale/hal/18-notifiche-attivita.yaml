# HAL — Voci esportate per RAG
# Capitolo 18 · Notifiche e attività · v1.2 (17-Sep-2026 · D-084)
# A-017 Notification center + A-021 preferenze UI shippati.
# 17-Sep: contatto annuncio privato (listing_inquiry) ≠ lead CRM agenzia.
# Ancora assenti: A-018 activity feed, push/SMS, SSE.

voci:

  # ---------- 18.1 · Cos'è ----------

  - id: notifiche.cos-e
    titolo: Cos'è "Notifiche e attività" in OMNIA v1.1
    modulo: Notifiche
    widget: null
    pubblico: [titolare, agente, segreteria, super_admin, b2c_client]
    livello: base
    tags: [notifiche, attivita, panoramica, d-051, campanella, a-017, a-021]
    correlati: [notifiche.canali-attivi, notifiche.limitazioni-v1, notifiche.dashboard-vs-activity-feed, notifiche.preferenze-utente]
    domanda_naturale: "Cos'è il modulo Notifiche di OMNIA? C'è un centro notifiche in-app? Esiste una campanella? OMNIA ha un feed attività recenti?"
    contenuto:
      a_cosa_serve: >
        Definire cosa OMNIA offre come notifiche: (1) email Resend,
        (2) inbox in-app con campanella e badge (A-017), (3) preferenze
        email UI (A-021), (4) toast sonner, (5) cron saved-searches,
        (6) audit Mongo senza timeline UI (A-018 ancora assente).
      quando_si_usa: >
        Quando cerchi la campanella, le preferenze, o ti chiedi se
        esiste un feed attività in dashboard.
      passi:
        - "Campanella in topbar ImmoWeb (sempre) e ImmobilCloud se loggato."
        - "Dropdown Ultime notifiche + badge non-lette + segna lette."
        - "API /api/notifications e collezione Mongo notifications."
        - "Preferenze in Impostazioni (B2B) e Account (B2C)."
        - "NON c'è ancora activity feed dashboard (A-018)."
        - "Push/SMS/WhatsApp non attivi; push in schema = dead code."
      errori_comuni:
        - problema: "Non vedo la campanella"
          soluzione: >
            ImmoWeb: topbar destra. Cloud: solo se autenticato.
            Ricarica dopo login.
      permessi:
        - Inbox per utente autenticato (proprie notifiche)
        - Preferenze: ogni utente sul proprio account
        - Cron saved-searches: solo super_admin
    screenshot:
      - "[SCREEN: cap18-bell-dropdown]"


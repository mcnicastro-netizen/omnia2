      a_cosa_serve: >
        Elenco delle collezioni Mongo append-only che tracciano eventi
        tecnici. Usate per debug/GDPR/rate-limit/sync-history. NESSUNA
        UI centralizzata v1: query Mongo diretta solo per super_admin.
      quando_si_usa: >
        Quando super_admin deve fare post-mortem di un bug, GDPR
        request, verificare uso HAL, log sync publishing.
      passi:
        - "al_audit (Cap. 10 HAL Agent CRM): ogni chat + improve
          (session_id, tokens, cost)."

      quando_si_usa: >
        Quando il titolare (o super_admin) invita un nuovo membro da
        POST /api/agencies/me/invites.
      passi:
        - "Trigger: apps/immoweb/invites.py:102 dopo creazione invito."
        - "A chi: email del collaboratore invitato (email specificata
          nel form invito)."
        - "Variabili: {{agency_name}}, {{inviter_name}}, {{role_label}},
          {{invite_url}}."
        - "Subject: 'Sei stato invitato a unirti a {{agency_name}} su
          OMNIA' (it) · analoghi en/es."
        - "Magic-link: token nel FRAGMENT URL (#token=...), NON nella
          query string, per best practice OWASP (nessun leak nel
          Referer HTTP header)."
        - "TTL: 7 giorni (documentato Cap. 13)."
        - "Lingua: dedotta dalla lingua dell'invitatore (o fallback 'it')."
      errori_comuni:
        - problema: "L'invito email non arriva al collaboratore"
          soluzione: >
            Vedi Cap. 13 §13.11. Controlla log `[EMAIL OK]` o

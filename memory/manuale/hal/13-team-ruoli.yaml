    domanda_naturale: "Che rapporto c'e' fra Collaboratori e gli altri moduli OMNIA?"
    contenuto:
      a_cosa_serve: >
        Capire come il modulo team si intreccia con Primo Accesso,
        Immobili (privacy L1-L4), HAL Knowledge, Impostazioni.
      quando_si_usa: >
        Per orientarti nella navigazione complessiva.
      passi:
        - "Cap. 1 Primo accesso: signup pubblico + onboarding 4-step
          che crea agenzia e promuove a agency_admin. Punto di
          partenza per il primo utente."
        - "Cap. 3 Immobili § privacy: L4 = solo team dell'agenzia
          (utenti in agency_ids). Il modulo Collaboratori determina
          implicitamente chi vede immobili L4."
        - "Cap. 12 HAL Knowledge: puoi chiedere a HAL Knowledge
          domande sui Collaboratori (es. 'Come invito un collega?')
          e le voci di questo capitolo (team.*) vengono usate come
          fonti."
        - "Cap. 24 Impostazioni (futuro): Billing, Domain Vault, dati
          fiscali agenzia - spazi riservati al agency_admin. Il
          ruolo che assegni qui determina l'accesso li'."
        - "Cap. 10 HAL Agent CRM: multi-tenant safe by design tramite
          agency_id auto-injected. Un agente della tua agenzia vede
          solo dati della tua agenzia, non di altre."
      errori_comuni:
        - problema: "Un agente vede immobili di altre agenzie"
          soluzione: >
            Non dovrebbe. Tutti gli endpoint filtrano per agency_id.
            Se succede, e' un bug: segnala al team OMNIA con
            screenshot.
      permessi:
        - Descrizione per tutti gli utenti

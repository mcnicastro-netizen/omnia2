    correlati: [halk.motore, halk.insufficient-context, halk.distinzione-tre-hal]
    domanda_naturale: "Cosa NON puo' fare HAL Knowledge? Quali sono i limiti attuali?"
    contenuto:
      a_cosa_serve: >
        Aspettative chiare su cosa HAL Knowledge non fa, per non
        chiedere cose che non puo' dare.
      quando_si_usa: >
        Prima di stimare quanto HAL Knowledge puo' sostituirsi al
        supporto o al team OMNIA.
      passi:
        - "Non e' multilingua: risponde bene solo in italiano (corpus
          quasi tutto in italiano). Inglese funziona con qualita'
          minore."
        - "Non usa embeddings neurali (SBERT, OpenAI ada): usa TF-IDF
          classico. Ok per corpus piccolo, rivedibile > 500 voci."
        - "Non ha memoria fra domande consecutive: ogni domanda e'
          one-shot. Per affinare, riformula la domanda intera."
        - "Non ha feedback loop utente inline (nessun bottone
          'utile/non utile' in v1)."
        - "Non ha rate limit dedicato in v1 (le domande sono
          economiche, pattern rate limit disponibile in
          al_agent.py se in futuro serve)."
        - "Non fa web search, no scraping siti esterni, no aggiornamento
          normativa in tempo reale."
        - "Non genera codice, non modifica dati, non esegue azioni
          nel CRM. Sola lettura sulla documentazione."
        - "Non e' multitenant a corpus: tutti gli utenti agenzia
          leggono lo stesso corpus OMNIA (i tuoi dati agenzia non
          sono indicizzati)."
        - "Non ha TTL automatico sulle sessioni salvate (storico
          resta indefinitamente v1)."
      errori_comuni:
        - problema: "Chiedo 2 volte e HAL fa follow-up"
          soluzione: >
            Non e' cosi'. Ogni domanda e' isolata. Per affinare la
            risposta, riformula la domanda intera includendo il
            contesto che ti serve.
      permessi:
        - Descritto per tutti gli utenti
    screenshot: []

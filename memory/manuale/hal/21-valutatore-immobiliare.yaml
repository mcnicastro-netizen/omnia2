    modulo: Valutatore
    widget: null
    pubblico: [privato, titolare, agente]
    livello: base
    tags: [valutatore, errori, troubleshooting, "401", "402", "403", "429", pdf, stripe, login]
    correlati: [valutatore.passi-stima-base, valutatore.passi-report-uni]
    domanda_naturale: "Perche' il valutatore non funziona? Errori comuni?"
    contenuto:
      a_cosa_serve: >
        Troubleshooting errori gate B2C e UX dual-tier.
      quando_si_usa: >
        Debug blocco stima o download PDF.
      passi:
        - "401 login_required: accedi ImmobilCloud."
        - "403 email_verification_required: verifica email account."
        - "429 base_limit_reached: quota 12 mesi esaurita, vedi reset_at."
        - "402 payment_required: tier UNI senza pagamento €2,99."
        - "PDF 402: entitlement UNI mancante o payload base-only."
        - "503 stripe_not_configured: Stripe non abilitato in env."
        - "Pro non visibile: sei su tier base, passa a card UNI."
      errori_comuni: []
      permessi:
        - "Troubleshooting"
      screenshot: []


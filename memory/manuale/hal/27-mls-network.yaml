# HAL — Capitolo 27 · MLS Network
# Linguaggio per agenti immobiliari (niente gergo tecnico)

voci:

  - id: mls.cos-e
    titolo: Cos'è OMNIA MLS?
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [network, collaborazioni, mls, cap27]
    correlati: [mls.dove-trovarlo, mls.join]
    domanda_naturale: "Cos'è OMNIA MLS?"
    contenuto:
      a_cosa_serve: >
        È la rete tra agenzie OMNIA: puoi vedere immobili condivisi da altre
        agenzie, collaborare con partner e ricevere o fare proposte di affare.
      quando_si_usa: >
        Quando vuoi collaborare con colleghi di altre agenzie invece di
        lavorare solo sul tuo inventario.
      passi:
        - "Nel menu a sinistra apri MLS."
        - "Se non sei ancora nel network, clicca «Entra nel network» (serve l'account del titolare)."
        - "Poi usa le schede Il mio MLS, rete locale e MLS Italia per sfogliare gli immobili."
      errori_comuni:
        - problema: "Non vedo immobili di altre agenzie"
          soluzione: >
            Controlla di essere entrato nel network e che le altre agenzie
            abbiano condiviso immobili (non privati).
      permessi:
        - "Tutti possono consultare; entrare nel network lo fa il titolare."
      screenshot: []

  - id: mls.dove-trovarlo
    titolo: Dove trovo MLS?
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [ui, menu, mls, cap27]
    correlati: [mls.cos-e, mls.join]
    domanda_naturale: "Dove trovo MLS?"
    contenuto:
      a_cosa_serve: >
        Ti indica dove aprire la rete multi-agenzia dentro OMNIA.
      quando_si_usa: >
        Quando cerchi il menu o il riquadro del network.
      passi:
        - "Nel menu a sinistra clicca MLS."
        - "Oppure da ImmobilCloud (Cloud) usa il riquadro della rete / MLS."
        - "Dentro trovi Il mio MLS, rete locale, MLS Italia, Partner e Offerte."
      errori_comuni:
        - problema: "Non trovo la voce MLS"
          soluzione: >
            Controlla di essere nell'area agenzia (ImmoWeb). Se non appare,
            chiedi al titolare di verificare il piano o i permessi.
      permessi:
        - "Visibile a titolare, agente e segreteria."
      screenshot: []

  - id: mls.join
    titolo: Come entro nel network?
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [join, onboarding, mls, cap27]
    correlati: [mls.cos-e, mls.inventory]
    domanda_naturale: "Come entro nel network?"
    contenuto:
      a_cosa_serve: >
        Attiva la tua agenzia nella rete OMNIA così potete condividere e
        collaborare con altre agenzie.
      quando_si_usa: >
        La prima volta che usate MLS, oppure se l'agenzia non risulta ancora iscritta.
      passi:
        - "Accedi con l'account del titolare (non basta l'agente)."
        - "Apri MLS dal menu a sinistra."
        - "Leggi il breve messaggio di adesione e clicca «Entra nel network»."
        - "Quando è attivo vedi le schede Il mio MLS, rete locale e MLS Italia."
      errori_comuni:
        - problema: "Il pulsante non funziona o dice che non ho permesso"
          soluzione: >
            Serve l'account del titolare. Se sei agente, chiedi al titolare
            di entrare nel network per tutta l'agenzia.
      permessi:
        - "Solo il titolare può iscrivere l'agenzia al network."
      screenshot: []

  - id: mls.inventory
    titolo: Il mio MLS, rete locale e MLS Italia
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [inventory, scope, mls, cap27]
    correlati: [mls.join, mls.privacy-visibilita]
    domanda_naturale: "Che differenza c'è tra Il mio MLS, locale e Italia?"
    contenuto:
      a_cosa_serve: >
        Tre viste sullo stesso network: i tuoi immobili condivisi, quelli
        della zona e quelli di tutta Italia.
      quando_si_usa: >
        Quando cerchi immobili da collaborare o controlli cosa hai messo in rete.
      passi:
        - "Apri MLS."
        - "Scheda «Il mio MLS»: immobili della tua agenzia condivisi in rete."
        - "Scheda rete locale (es. provincia): immobili condivisi vicino a te."
        - "Scheda «MLS Italia»: immobili condivisi in tutta Italia."
      errori_comuni:
        - problema: "Il mio MLS è vuoto"
          soluzione: >
            Condividi immobili dall'anagrafica Immobili scegliendo una
            privacy «pubblica» o «solo MLS» (non «privato»).
      permessi:
        - "Consultazione per tutti; modifica immobili secondo i ruoli Immobili."
      screenshot: []

  - id: mls.privacy-visibilita
    titolo: Quali immobili finiscono in MLS?
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [privacy, visibility, mls, cap27]
    correlati: [mls.inventory]
    domanda_naturale: "Quali immobili si vedono in MLS?"
    contenuto:
      a_cosa_serve: >
        Solo gli immobili che scegli di condividere entrano nel network.
      quando_si_usa: >
        Quando carichi o modifichi un immobile e decidi se collaborare o no.
      passi:
        - "Apri Immobili e seleziona l'annuncio."
        - "Nella privacy/visibilità scegli «pubblico» o «solo MLS» per condividerlo."
        - "Se metti «privato», resta solo nella tua agenzia e non appare nelle offerte MLS."
      errori_comuni:
        - problema: "Ho messo l'immobile ma non lo vedo in MLS"
          soluzione: >
            Controlla che non sia privato e che l'agenzia sia già entrata nel network.
      permessi:
        - "Chi può modificare immobili nella tua agenzia."
      screenshot: []

  - id: mls.partner
    titolo: Come gestisco i partner?
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [partner, inviti, mls, cap27]
    correlati: [mls.offerte]
    domanda_naturale: "Come gestisco i partner?"
    contenuto:
      a_cosa_serve: >
        I partner sono agenzie con cui collabori in modo più stretto
        (inviti da accettare o rifiutare).
      quando_si_usa: >
        Quando un'altra agenzia ti invita, o quando vuoi vedere con chi collabori.
      passi:
        - "Apri MLS."
        - "Nella sezione Partner vedi gli inviti in attesa."
        - "Clicca Accetta o Rifiuta sull'invito."
        - "I partner già attivi restano elencati nella stessa area."
      errori_comuni:
        - problema: "Non posso accettare l'invito"
          soluzione: >
            Prova con l'account del titolare. Se l'invito è scaduto, chiedi
            all'altra agenzia di reinviarlo.
      permessi:
        - "Gestione inviti: di solito il titolare; consultazione anche agenti."
      screenshot: []

  - id: mls.offerte
    titolo: Come funzionano le offerte?
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [offerte, mls, cap27]
    correlati: [mls.partner, mls.inventory]
    domanda_naturale: "Come funzionano le offerte MLS?"
    contenuto:
      a_cosa_serve: >
        Un'offerta è una proposta di collaborazione su un immobile condiviso
        verso un'altra agenzia della rete.
      quando_si_usa: >
        Quando hai un cliente per un immobile di un collega, o ricevi una proposta.
      passi:
        - "Apri MLS e trova l'immobile nelle schede rete locale o MLS Italia."
        - "Invia un'offerta / proposta di collaborazione sull'immobile."
        - "L'agenzia destinataria la vede in Offerte e può accettare o rifiutare."
        - "Nella tua area Offerte segui lo stato (in attesa, accettata, rifiutata)."
      errori_comuni:
        - problema: "Non posso fare offerte su un immobile"
          soluzione: >
            L'immobile deve essere condiviso (non privato) e la tua agenzia
            deve essere nel network.
      permessi:
        - "Agenti e titolare possono lavorare sulle offerte secondo i ruoli agenzia."
      screenshot: []

  - id: mls.pubblico
    titolo: Cosa vede il pubblico sul network?
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [b2c, search, mls, cap27]
    correlati: [mls.cos-e]
    domanda_naturale: "I clienti vedono il network MLS?"
    contenuto:
      a_cosa_serve: >
        Sul lato pubblico (ImmobilCloud) c'è una ricerca semplificata degli
        immobili condivisi in rete, con filtri tipo zona e prezzo.
      quando_si_usa: >
        Quando spieghi a un cliente cosa trova sulla vetrina, o controlli
        la presenza della rete all'esterno.
      passi:
        - "Apri ImmobilCloud / Cloud."
        - "Usa il riquadro della rete o la ricerca pubblica collegata al MLS."
        - "Filtra per zona o prezzo se disponibili."
      errori_comuni:
        - problema: "I numeri sembrano alti ma non ho clienti reali"
          soluzione: >
            In questa fase possono esserci dati di dimostrazione finché
            non arrivano molte agenzie reali.
      permessi:
        - "La ricerca pubblica è aperta; la gestione resta in area agenzia."
      screenshot: []

  - id: mls.limitazioni-v1
    titolo: Limiti attuali di MLS
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [limiti, mls, cap27]
    correlati: [mls.cos-e]
    domanda_naturale: "Quali limiti ha MLS oggi?"
    contenuto:
      a_cosa_serve: >
        Ti dice cosa è già disponibile e cosa ancora no, così non aspetti funzioni mancanti.
      quando_si_usa: >
        Quando qualcosa non compare o i contatori sembrano di prova.
      passi:
        - "MLS v1: entra nel network, inventario, partner e offerte."
        - "Gli immobili privati non entrano nelle collaborazioni."
        - "Academy non è collegata a MLS in questa versione."
        - "Alcuni numeri pubblici possono essere di dimostrazione finché il network non è pieno di agenzie reali."
      errori_comuni:
        - problema: "Cerco una funzione Academy dentro MLS"
          soluzione: "Non è inclusa in questa versione: resta sul flusso MLS descritto sopra."
      permessi:
        - "Tutti possono leggere questi limiti."
      screenshot: []

  - id: mls.collegamenti
    titolo: Collegamenti con Immobili, privacy e Match
    modulo: MLS
    widget: null
    pubblico: [titolare, agente, segreteria]
    livello: base
    tags: [privacy, match, immobili, mls, cap27]
    correlati: [mls.privacy-visibilita]
    domanda_naturale: "MLS come si collega a Immobili e Match?"
    contenuto:
      a_cosa_serve: >
        MLS usa gli immobili che gestisci già in OMNIA e rispetta la privacy
        che scegli; Match resta lo strumento per accoppiare clienti e case.
      quando_si_usa: >
        Quando ti chiedi se cambiare privacy o usare Match insieme al network.
      passi:
        - "Carica e aggiorna gli immobili da Immobili."
        - "Imposta la privacy: solo ciò che condividi entra in MLS."
        - "Per i tuoi clienti usa Match come di consueto; MLS serve per collaborare con altre agenzie."
      errori_comuni:
        - problema: "Confondo Match e MLS"
          soluzione: >
            Match = clienti e immobili della tua agenzia. MLS = collaborazioni
            con altre agenzie sul network.
      permessi:
        - "Come da moduli Immobili e Match."
      screenshot: []

<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#f5f5f4;font-family:Georgia,'Times New Roman',serif;color:#1c1917;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f5f4">
    <tr><td align="center" style="padding:40px 20px;">
      <table width="540" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border:1px solid #e7e5e4;">
        <tr><td style="padding:32px 32px 16px 32px;border-bottom:1px solid #e7e5e4;">
          <span style="font-size:22px;letter-spacing:-0.5px;font-weight:500;">OMNIA · Incasso B2C</span>
        </td></tr>
        <tr><td style="padding:32px;">
          <h1 style="margin:0 0 16px 0;font-size:26px;font-weight:500;">Nuovo pagamento ricevuto</h1>
          <table width="100%" cellpadding="0" cellspacing="0" style="font-family:Arial,sans-serif;font-size:14px;color:#1c1917;">
            <tr><td style="padding:8px 0;border-bottom:1px solid #e7e5e4;">Importo</td><td align="right" style="padding:8px 0;border-bottom:1px solid #e7e5e4;"><strong>{{amount}}</strong></td></tr>
            <tr><td style="padding:8px 0;border-bottom:1px solid #e7e5e4;">Prodotto</td><td align="right" style="padding:8px 0;border-bottom:1px solid #e7e5e4;">{{product_label}}</td></tr>
            <tr><td style="padding:8px 0;border-bottom:1px solid #e7e5e4;">Cliente</td><td align="right" style="padding:8px 0;border-bottom:1px solid #e7e5e4;">{{client_name}} &lt;{{client_email}}&gt;</td></tr>
            <tr><td style="padding:8px 0;border-bottom:1px solid #e7e5e4;">Codice cliente</td><td align="right" style="padding:8px 0;border-bottom:1px solid #e7e5e4;">{{client_code}}</td></tr>
            <tr><td style="padding:8px 0;border-bottom:1px solid #e7e5e4;">Codice annuncio</td><td align="right" style="padding:8px 0;border-bottom:1px solid #e7e5e4;">{{listing_code}}</td></tr>
            <tr><td style="padding:8px 0;">Stripe session</td><td align="right" style="padding:8px 0;font-size:12px;color:#78716c;">{{session_id}}</td></tr>
          </table>
          <p style="font-size:13px;line-height:1.5;color:#78716c;margin:20px 0 0 0;">
            Dettaglio anche in Founder Ops → /app/ops
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>

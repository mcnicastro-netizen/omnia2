<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#f5f5f4;font-family:Georgia,serif;color:#1c1917;">
  <table width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:40px 20px;">
    <table width="540" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="border:1px solid #e7e5e4;">
      <tr><td style="padding:32px;">
        <h1 style="margin:0 0 16px 0;font-size:26px;">Hola {{name}},</h1>
        <p style="font-size:16px;line-height:1.6;color:#44403c;">
          El plan <strong>{{tier}}</strong> de <strong>{{agency_name}}</strong> vence el
          <strong>{{period_end}}</strong> (en <strong>{{days_left}}</strong> días).
        </p>
        <a href="{{billing_url}}" style="display:inline-block;background:#1c1917;color:#fafaf9;text-decoration:none;padding:14px 28px;font-family:Arial,sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-top:16px;">Abrir facturación →</a>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>

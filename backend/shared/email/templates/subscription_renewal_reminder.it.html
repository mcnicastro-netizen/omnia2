<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#f5f5f4;font-family:Georgia,'Times New Roman',serif;color:#1c1917;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f5f4">
    <tr><td align="center" style="padding:40px 20px;">
      <table width="540" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border:1px solid #e7e5e4;">
        <tr><td style="padding:32px;">
          <h1 style="margin:0 0 16px 0;font-size:26px;font-weight:500;">Ciao {{name}},</h1>
          <p style="font-size:16px;line-height:1.6;color:#44403c;margin:0 0 16px 0;">
            L’abbonamento <strong>{{tier}}</strong> di <strong>{{agency_name}}</strong>
            scade il <strong>{{period_end}}</strong> (tra <strong>{{days_left}}</strong> giorni).
          </p>
          <p style="font-size:16px;line-height:1.6;color:#44403c;margin:0 0 24px 0;">
            Controlla piano e metodo di pagamento da Piano &amp; Crediti — niente azione se il rinnovo automatico Stripe è già attivo.
          </p>
          <a href="{{billing_url}}" style="display:inline-block;background:#1c1917;color:#fafaf9;text-decoration:none;padding:14px 28px;font-family:Arial,sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;">Apri Piano &amp; Crediti →</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

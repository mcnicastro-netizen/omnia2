# OMNIA API on Railway (Hetzner blocked — Plan B).
# SoT runbook: docs/ops/RAILWAY_DEPLOY.md
# Deploy service = backend only (FE stays on Vercel).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
# memory/** incluso: corpus HAL (D-084/D-135) è COPY in Dockerfile.railway —
# senza questo i soli push docs non aggiornano l'immagine e il reindex rilegge YAML vecchi.
watchPatterns = ["backend/**", "memory/**", "Dockerfile.railway", "railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
